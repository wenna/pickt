function freshDataV2Base(){const extraTopics=[['分数运算','运算顺序'],['百分数','应用题'],['比和比例','应用题'],['圆','面积与体积'],['方程'],['应用题','面积与体积']];const questions=SEED_QUESTIONS.map((q,i)=>normalizeQuestion({...clone(q),topics:extraTopics[i],addedAt:localDate(-[0,3,8,16,28,45][i])},i));questions.push(normalizeQuestion({id:'q7',stem:'english',topics:['主谓一致','语法'],causes:['知识点不熟'],grade:'六年级',subject:'英语',status:'pending',source:'英语示例 · 语法练习',answer:'is',explain:'milk 是不可数名词，这里使用 is。',addedAt:localDate(-2)}));questions.push(normalizeQuestion({id:'q8',stem:'science',topics:['物态变化'],causes:['概念混淆'],grade:'五年级',subject:'科学',status:'pending',source:'科学示例 · 物态变化',answer:'熔化',explain:'物质从固态变成液态的过程叫作熔化。',addedAt:localDate(-12)}));return migrateData({questions,papers:[],counter:1,topicCatalog:[],causeCatalog:[]});}

function libraryV2Base(){const pending=activeQuestions().filter(q=>q.status!=='mastered'&&(state.subject==='全部'||q.subject===state.subject)).length;return `${appHeader('我的错题本','每一道错题，都是进步的起点',null,`<button class="avatar" data-action="settings" aria-label="打开家长设置">六</button>`)}${!storageOK?notice('当前浏览器无法持久保存，关闭后可能恢复演示数据。',true):''}<section class="hero"><div class="hero-top">${icon('leaf')} 今天，向前一小步</div><h3>${pending} 道题，等你再试试</h3><p>从不太熟的地方开始，慢慢变熟练。</p><button class="btn primary" data-action="go" data-page="practice">开始练一练 ${icon('arrow')}</button></section><div class="search">${icon('search')}<input id="library-search" type="search" placeholder="搜索题目、知识点或错因" aria-label="搜索错题" value="${escapeHTML(state.search)}"></div><div class="subject-row">${['数学','英语','科学','全部'].map(s=>`<button class="chip ${state.subject===s?'active':''}" data-action="subject" data-value="${s}">${s}</button>`).join('')}</div><div class="chip-row">${[['pending','待巩固'],['mastered','已掌握'],['all','全部错题']].map(([v,t])=>`<button class="chip ${state.filter===v?'active':''}" data-action="filter" data-value="${v}">${t}</button>`).join('')}<button class="chip ${state.topic!=='全部'?'active':''}" data-action="library-topic-modal">${state.topic==='全部'?'知识点 ▾':escapeHTML(state.topic)+' ▾'}</button></div><div class="section-head"><h3>一点点，积累起来</h3><span class="subtle" id="question-count">共 ${libraryQuestions().length} 道</span></div><div id="question-list">${cards(libraryQuestions())}</div>`;}
function detailV2Base(){const q=data.questions.find(q=>q.id===state.detailId);if(!q)return appHeader('题目暂不可用','','library');return `${appHeader('错题详情',q.subject+' · '+q.grade,'library',`<button class="icon-button" data-action="edit-meta" aria-label="编辑分类">${icon('settings')}</button>`)}<div class="detail-image">${questionHTML(q)}${q.ink?`<div class="ink">原答：${escapeHTML(q.ink)}</div>`:''}</div><div class="card"><div class="info-row"><span class="subtle">知识点 · 多选</span><div class="info-value"><div class="tag-row">${tagsHTML(q.topics)}</div><button class="edit-link" data-action="edit-meta">修改分类</button></div></div><div class="info-row"><span class="subtle">这次错在哪里</span><span class="info-value">${escapeHTML(q.causes.join('、')||'尚未填写')}</span></div><div class="info-row"><span class="subtle">加入时间</span><span>${escapeHTML(q.addedAt)}</span></div><div class="info-row"><span class="subtle">掌握情况</span><button class="edit-link" data-action="toggle-mastered">${q.status==='mastered'?'已掌握 · 改为待巩固':'待巩固 · 标记已掌握'}</button></div><div class="info-row"><span class="subtle">来自</span><span class="info-value">${escapeHTML(q.source)}</span></div></div><button class="btn full" data-action="answer">${state.answer?'收起参考答案':'想好了，再看答案'}</button>${state.answer?`<div class="answer"><strong>参考答案：${escapeHTML(q.answer)}</strong><p>${escapeHTML(q.explain)}</p></div>`:''}<div class="section-head"><h3>我练过的足迹</h3><span class="subtle">${q.history.length} 次</span></div><div class="card">${q.history.length?q.history.slice(-5).reverse().map(h=>`<div class="history-item"><span>${escapeHTML(h.date)}${h.source==='photo-demo'?' · 拍卷确认':''}</span><span>${h.result==='correct'?'✓ 做对了':'再练练'}</span></div>`).join(''):'<p class="subtle">还没重做过，下一次试试看。</p>'}</div><button class="btn primary full" data-action="add-to-paper">${icon('plus')} 加入练习卷</button>`;}

function matchesFilters(q,f){if(f.subject!=='全部'&&q.subject!==f.subject)return false;if(f.grade!=='全部'&&q.grade!==f.grade)return false;if(!f.includeMastered&&q.status==='mastered')return false;if(f.topics.length&&!f.topics.some(t=>q.topics.includes(t)))return false;if(f.causes.length&&!f.causes.some(c=>q.causes.includes(c)))return false;if(f.range==='today'&&q.addedAt!==localDate())return false;if(f.range==='7'&&(q.addedAt<localDate(-6)||q.addedAt>localDate()))return false;if(f.range==='30'&&(q.addedAt<localDate(-29)||q.addedAt>localDate()))return false;if(f.range==='custom'&&((f.from&&q.addedAt<f.from)||(f.to&&q.addedAt>f.to)))return false;return true;}

function currentPaper(){return data.papers.find(p=>p.id===state.paperId);}
function generatePaper(){const qs=chosenQuestions();if(!qs.length)return toast('请先选择题目');const index=data.counter++,subjects=cleanTags(qs.map(q=>q.subject));const paper={id:`p-${Date.now()}-${index}`,title:`我的${subjects.length===1?subjects[0]:'综合'}巩固练习 ${String(index).padStart(2,'0')}`,questions:clone(qs),completed:false,results:{},attempts:[]};data.papers.push(paper);persist();state.tab='practice';navigate('preview',{paperId:paper.id,paperAnswers:false,space:'medium',gradingAttempt:null});}
function paperPages(p,kind='student'){const max=kind==='parent'?3:state.space==='large'?2:state.space==='small'?4:3;const pages=[];for(let i=0;i<p.questions.length;i+=max)pages.push({questions:p.questions.slice(i,i+max),start:i});return pages;}
function numberedQuestion(q,index){return questionHTML(q).replace('<div class="q-content">',`<div class="q-content">${index+1}. `);}
function previewV2Base(){const p=currentPaper();if(!p)return appHeader('先选几道题吧','','practice');const kind=state.paperAnswers?'parent':'student',pages=paperPages(p,kind);return `${appHeader('练习卷预览',`${p.questions.length} 道题 · A4 纵向 · 原题重练`,'practice',`<button class="icon-button" data-action="rename-paper" aria-label="修改练习卷标题">${icon('settings')}</button>`)}<div class="mode-switch"><button class="${!state.paperAnswers?'active':''}" data-action="paper-view" data-value="student">学生练习卷</button><button class="${state.paperAnswers?'active':''}" data-action="paper-view" data-value="answer">家长参考页</button></div><div class="page-controls"><label for="paper-space">学生卷留白</label><select id="paper-space">${[['small','少一些'],['medium','适中'],['large','多一些']].map(([v,t])=>`<option value="${v}" ${state.space===v?'selected':''}>${t}</option>`).join('')}</select><span class="subtle">本部分 ${pages.length} 页</span></div><div class="print-actions"><button class="btn primary full" data-action="print-all">${icon('print')} 打印全部 / 存为 PDF</button><p class="subtle">学生卷 + 家长参考页，分开纸张输出</p><div class="paper-toolbar"><button class="btn small" data-action="print-paper">只打印当前部分</button><button class="btn small soft" data-action="reorder-paper">调整题序</button></div></div>${pages.map((page,pi)=>`<article class="a4 space-${state.space}" aria-label="${state.paperAnswers?'家长参考页':'学生练习卷'}第${pi+1}页"><h3>${escapeHTML(p.title)}</h3><div class="paper-subtitle">${state.paperAnswers?'家长参考页 · 含答案与解析':'学生练习卷 · 姓名：________ 日期：________'}</div>${page.questions.map((q,i)=>`<div class="paper-question">${numberedQuestion(q,page.start+i)}${state.paperAnswers?`<p class="paper-answer">答案：${escapeHTML(q.answer)}<br>${escapeHTML(q.explain)}</p>`:'<div class="answer-space"></div>'}</div>`).join('')}<div class="paper-footer">拾题 · ${state.paperAnswers?'家长参考':'学生练习'}　${pi+1} / ${pages.length}</div></article>`).join('')}<button class="btn primary full" data-action="${p.gradingDraft?'resume-grading':'start-review'}" data-id="${p.id}">${icon('camera')} ${p.gradingDraft?'继续核对批改结果':p.completed?'查看批改记录':'拍完成卷，记录结果'}</button>${p.completed&&!p.gradingDraft?'<button class="btn full" style="margin-top:9px" data-action="new-photo-attempt">再拍一次，记录新练习</button>':''}<p class="paper-summary">${p.completed?'相同记录不会重复计入练习次数。':'做完后拍照，查看逐题批改结果；不确定的题确认后再入库。'}</p>`;}
function buildPrintHTML(p,scope='student',duplex=false){const groups=scope==='all'?['student','parent']:[scope];let output='';for(const kind of groups){const pages=paperPages(p,kind);if(kind==='parent'&&scope==='all'&&duplex&&paperPages(p,'student').length%2===1)output+='<article class="print-page duplex-spacer" data-kind="blank"><p class="print-meta">此页留白 · 家长参考页从下一张纸开始</p></article>';output+=pages.map((page,pi)=>`<article class="print-page space-${state.space} ${kind==='parent'&&pi===0?'parent-start':''}" data-kind="${kind}"><h2>${escapeHTML(p.title)}</h2><p class="print-meta">${kind==='parent'?'家长参考页 · 含答案和解析':'学生练习卷 · 姓名：________ 日期：________'}</p>${page.questions.map((q,i)=>`<div class="print-question">${numberedQuestion(q,page.start+i)}${kind==='parent'?`<p class="print-answer">答案：${escapeHTML(q.answer)}<br>${escapeHTML(q.explain)}</p>`:'<div class="print-blank"></div>'}</div>`).join('')}<div class="print-page-number">${kind==='parent'?'家长参考页':'学生练习卷'}　${pi+1} / ${pages.length}</div></article>`).join('');}return output;}
function preparePrint(scope=state.paperAnswers?'parent':'student',duplex=false){const p=currentPaper();if(!p)return;document.getElementById('print-root').innerHTML=buildPrintHTML(p,scope,duplex);window.print();}
function printAllModal(){const p=currentPaper(),studentPages=paperPages(p,'student').length,parentPages=paperPages(p,'parent').length,blank=state.printDuplex&&studentPages%2===1?1:0;openModal('整套打印 / 存为 PDF',`<div class="print-section-card"><span class="mini-number">1</span><div><strong>学生练习卷</strong><p class="subtle">${studentPages} 页 · 不含答案</p></div></div><div class="print-section-card"><span class="mini-number">2</span><div><strong>家长参考页</strong><p class="subtle">${parentPages} 页 · 含答案和解析 · 另起纸张</p></div></div><label class="toggle-row"><input id="print-duplex" type="checkbox" ${state.printDuplex?'checked':''}>打印机将使用双面打印</label>${notice(state.printDuplex?(blank?'学生卷是奇数页，自动补 1 页空白，使家长页从新一张 A4 纸开始。':'学生卷是偶数页，家长参考页将从新一张 A4 纸开始。'):'按单面输出，每部分都强制另起 A4 页。')}<p class="subtle" style="line-height:1.9">共 ${studentPages+parentPages+blank} 页${blank?'（含 1 页留白）':''}。请在浏览器打印面板选择 A4，并保持与这里一致的单双面设置。保存 PDF 也使用同一分页顺序。</p><button class="btn primary full" style="margin-top:18px" data-action="confirm-print-all">确认打印全部 / 存为 PDF</button>`);}
function startPhotoAttempt(){const p=currentPaper();state.gradingAttempt=null;state.reviewIndex=0;state.reviewAnswer=false;navigate('gradeCapture');}
function gradeCapture(){const p=currentPaper();return `${appHeader('拍已完成的试卷','自动识别作答，核对后记入练习','preview')}<div class="scan-visual" style="height:165px"><div class="mini-paper"><h4>已完成的练习卷</h4><div class="line"></div><div class="ink" style="font-size:16px">答：102 元</div><div class="line"></div><div class="ink" style="font-size:16px">x = 14</div></div><div class="scan-badge">${icon('camera')}</div></div><div class="card"><h3 style="font-size:15px">${escapeHTML(p.title)}</h3><p class="subtle" style="margin-top:7px">${p.questions.length} 道题 · 示例会模拟整份完成卷，不读取照片</p></div><div class="capture-steps"><p><span>1</span>拍清整页，题号和作答一起拍到</p><p><span>2</span>对照原练习卷，识别每道题的答案</p><p><span>3</span>核对不确定的结果，再确认入库</p></div><button class="btn primary full" data-action="mock-capture">${icon('camera')} 模拟拍摄整份完成卷</button><button class="btn full" style="margin-top:10px" data-action="mock-album">${icon('image')} 模拟从相册导入完成卷</button>${notice('本 Demo 使用预设识别结果，不进行真实图像识别或自动判题。')}<button class="text-button full" data-action="manual-review">不方便拍照？改用手动记录</button>`;}
function gradeProcessing(){return `${appHeader('正在整理完成卷','识别过程模拟','gradeCapture')}<div class="success"><div class="success-icon">${icon('scan')}</div><h3>逐题对照，慢慢确认</h3><p>模拟匹配试卷、识别作答和对照答案。<br>不确定的题会单独留给你核对。</p><div class="progress-track"><div style="width:72%"></div></div>${notice('这里不调用 OCR 或模型，稍后展示预设的批改示例。')}</div>`;}
function mockItems(p){return p.questions.map((q,i)=>{const ambiguous=p.questions.length>1&&i===p.questions.length-1;const verdict=ambiguous?null:i%2===0?'correct':'wrong';return {questionId:q.id,recognized:ambiguous?'字迹不清，末位数字待核对':verdict==='correct'?q.answer:({fraction:'9/10',percent:'18 元',ratio:'男生 20 人，女生 20 人',circle:'25.12 平方厘米',equation:'x = 26',area:'96 千克',scanFraction:'1/2',scanPercent:'20 本',scanRatio:'75 mL',scanCircle:'15.7 cm',english:'are',science:'凝固'}[q.stem]||'待核对的作答'),suggested:verdict,verdict,reviewed:false,reason:ambiguous?'作答识别不完整，需要人工核对':'模拟对照参考答案，结果可以修改'};});}
function completeMockGrading(){const p=currentPaper();if(!p||state.page!=='gradeProcessing')return;state.gradingAttempt={id:`a-${Date.now()}-${data.counter++}`,source:'photo-demo',date:localDate(),items:mockItems(p),photoCount:paperPages(p,'student').length,committed:false};navigate('gradeResults');}
function gradingPending(){return state.gradingAttempt?state.gradingAttempt.items.filter(item=>!['correct','wrong','skip'].includes(item.verdict)).length:0;}
function resultLabel(result){return result==='correct'?'做对了':result==='wrong'?'再练练':result==='skip'?'暂未做':'待确认';}
function gradeResultsV2Base(){const p=currentPaper(),a=state.gradingAttempt;if(!a)return appHeader('还没有批改结果','','gradeCapture');const pending=gradingPending(),correct=a.items.filter(i=>i.verdict==='correct').length,wrong=a.items.filter(i=>i.verdict==='wrong').length;return `${appHeader(a.committed?'本次批改记录':'批改结果 · 模拟',`${escapeHTML(p.title)} · ${a.items.length} 道题`,'preview')}<div class="grading-summary"><div><strong>${correct}</strong><span>做对了</span></div><div><strong>${wrong}</strong><span>再练练</span></div><div><strong>${pending}</strong><span>待确认</span></div></div>${notice(a.committed?'本次结果已保存，查看不会重复加入练习记录。':pending?`有 ${pending} 道题识别不明确，请核对后再入库。没有作答不能直接当作做错。`:'所有题目都有确认结果，可以统一加入练习记录。',pending>0)}${p.questions.map((q,i)=>{const item=a.items.find(v=>v.questionId===q.id);return `<div class="card grade-card ${!item.verdict?'needs-review':''}"><div class="q-top"><strong style="font-size:13px">第 ${i+1} 题</strong><span class="tag ${!item.verdict?'orange':item.verdict==='correct'?'':'gray'}">${resultLabel(item.verdict)}</span></div>${questionHTML(q)}<div class="recognized-answer"><span class="subtle">识别到的作答</span><p>${escapeHTML(item.recognized||'未录入')}</p></div><p class="subtle" style="margin:9px 0;line-height:1.7">${item.reviewed?'已由你核对 / 更正':escapeHTML(item.reason)}</p><button class="btn small ${!item.verdict?'primary':'soft'}" data-action="grade-item" data-id="${q.id}">${a.committed?'查看对照':'核对 / 更正'}</button></div>`;}).join('')}<div class="sticky-action">${a.committed?'<button class="btn primary" data-action="go" data-page="reviewDone">查看练习总结</button>':`<button class="btn primary" data-action="commit-grading" ${pending?'disabled':''}>${pending?'还有 '+pending+' 道待确认':'确认并加入练习记录'}</button>`}</div><p class="subtle">识别与判题均为演示；正式版仍需验证字迹、题型和答案准确性。</p>`;}
function openGradeItem(id){const a=state.gradingAttempt,q=currentPaper().questions.find(q=>q.id===id),item=a.items.find(i=>i.questionId===id);state.gradeDraft={...clone(item),error:''};renderGradeItem(q);}
function renderGradeItem(q=currentPaper().questions.find(q=>q.id===state.gradeDraft.questionId)){const draft=state.gradeDraft,readOnly=state.gradingAttempt.committed;openModal(readOnly?'查看批改对照':'核对这道题',`<div class="detail-image">${questionHTML(q)}</div><div class="answer"><strong>参考答案：${escapeHTML(q.answer)}</strong><p>${escapeHTML(q.explain)}</p></div><label class="field"><span>识别到的作答 ${readOnly?'':'（可修正）'}</span><textarea id="recognized-answer" maxlength="200" ${readOnly?'readonly':''}>${escapeHTML(draft.recognized)}</textarea></label><p class="field-title">确认结果</p><div class="chip-row">${['correct','wrong','skip'].map(v=>`<button class="chip ${draft.verdict===v?'active':''}" data-action="grade-verdict" data-value="${v}" ${readOnly?'disabled':''}>${resultLabel(v)}</button>`).join('')}</div>${draft.error?`<p class="form-error" role="alert">${draft.error}</p>`:''}<button class="btn primary full" style="margin-top:14px" data-action="${readOnly?'close-modal':'save-grade-item'}">${readOnly?'关闭':'确认这道题'}</button>`);}
function commitGrading(){const p=currentPaper(),a=state.gradingAttempt;if(!p||!a)return;if(a.committed||p.attempts.some(previous=>previous.id===a.id)){navigate('reviewDone');return;}if(a.items.length!==p.questions.length||gradingPending()){toast('请先确认所有题目的批改结果');return;}const results={};for(const item of a.items){results[item.questionId]=item.verdict;const original=data.questions.find(q=>q.id===item.questionId);if(original&&item.verdict!=='skip'){original.history.push({date:a.date.slice(5).replace('-','月')+'日',result:item.verdict,source:a.source,attemptId:a.id});if(item.verdict==='wrong')original.status='pending';}}a.committed=true;p.attempts.push(clone(a));p.results=results;p.completed=true;persist();navigate('reviewDone');}
function startManualReview(){const p=currentPaper();state.gradingAttempt={id:`manual-${Date.now()}-${data.counter++}`,source:'manual',date:localDate(),committed:false,photoCount:0,items:p.questions.map(q=>({questionId:q.id,recognized:'手动记录',suggested:null,verdict:null,reviewed:true,reason:'手动确认'}))};navigate('review',{reviewIndex:0,reviewAnswer:false});}
function review(){const p=currentPaper(),q=p.questions[state.reviewIndex],item=state.gradingAttempt.items.find(i=>i.questionId===q.id);return `${appHeader('手动记录 · 备用入口',`第 ${state.reviewIndex+1} / ${p.questions.length} 道`,'gradeCapture')}<div class="detail-image">${questionHTML(q)}</div><button class="btn full" data-action="review-answer">${state.reviewAnswer?'收起参考答案':'核对参考答案'}</button>${state.reviewAnswer?`<div class="answer"><strong>${escapeHTML(q.answer)}</strong><p>${escapeHTML(q.explain)}</p></div>`:''}<div class="result-options">${['correct','wrong','skip'].map(v=>`<button class="btn ${item.verdict===v?'primary':''}" data-action="review-result" data-value="${v}">${resultLabel(v)}</button>`).join('')}</div><div class="bottom-actions"><button class="btn" data-action="review-prev" ${!state.reviewIndex?'disabled':''}>上一题</button><button class="btn primary" data-action="review-next" ${!item.verdict?'disabled':''}>${state.reviewIndex===p.questions.length-1?'核对全部结果':'下一题'}</button></div>`;}
function reviewDone(){const p=currentPaper(),results=p?.results||{},correct=Object.values(results).filter(v=>v==='correct').length,wrong=Object.values(results).filter(v=>v==='wrong').length,skip=Object.values(results).filter(v=>v==='skip').length;return `${appHeader('又向前一步','每一次认真，都值得被记住','practice')}<div class="success"><div class="success-icon">${icon('leaf')}</div><h3>这次练习，记好了</h3><p>会做的更熟练，<br>还不熟的，我们下次再见。</p><div class="review-counters"><div><strong>${correct}</strong><small>做对了</small></div><div><strong style="color:#aa8056">${wrong}</strong><small>再练练</small></div><div><strong style="color:#648bb4">${skip}</strong><small>暂未做</small></div></div>${notice('已确认结果加入模拟记录；未做不计错，一次做对不自动标为已掌握。')}<button class="btn primary full" data-action="view-grading-record">查看本次批改明细</button><button class="btn full" style="margin-top:10px" data-action="go" data-page="library">回到错题本</button></div>`;}
function settingsV2Base(){return `${appHeader('家长设置','演示数据仅保存在当前浏览器','library')}<div class="card"><h3>小禾的学习空间 <span class="tag">演示 V2.4</span></h3><p class="subtle" style="margin-top:8px">${activeQuestions().length} 道题 · ${activePapers().length} 份练习卷</p></div><div class="settings-list"><button data-action="export-demo"><span>导出模拟资料备份</span>${icon('download')}</button><button data-action="reset-confirm"><span>恢复初始演示数据</span>${icon('undo')}</button></div><div class="card"><h3>正式版安装方式</h3><div class="build-flow"><div><span>1</span>代码推送到 GitHub</div><div><span>2</span>在 GitHub 编译并生成 IPA</div><div><span>3</span>下载 IPA，自行签名侧载</div></div></div>${notice('拍卷识别和自动批改都是交互模拟，尚未接入实际服务。旧版模拟数据会迁移并保留。')}`;}

function render(){const views={library,detail,scan,capture,classify,saved,practice,preview,gradeCapture,gradeProcessing,gradeResults,review,reviewDone,settings,trash};screen.innerHTML=(views[state.page]||library)();document.getElementById('app-nav').innerHTML=[['library','book','错题本'],['scan','scan','拍试卷'],['practice','practice','练一练']].map(([id,ic,name])=>`<button class="${state.tab===id?'active':''}" data-action="go" data-page="${id}" ${state.tab===id?'aria-current="page"':''}>${id==='scan'?`<span class="scan-nav">${icon(ic)}</span>`:icon(ic)}<span>${name}</span></button>`).join('');const stage=['scan','capture','classify','saved'].includes(state.page)?1:['practice','preview'].includes(state.page)?2:['gradeCapture','gradeProcessing','gradeResults','review','reviewDone'].includes(state.page)?3:0;document.getElementById('journey').innerHTML=[['library','把错题收好'],['scan','从试卷里选题'],['practice','筛选、组卷、打印'],['record','拍完成卷，记下进步']].map(([page,label],i)=>`<button class="${i===stage?'active':''}" data-action="journey" data-page="${page}"><span class="step-number">0${i+1}</span>${label}</button>`).join('');const note=NOTES[state.page]||NOTES.library;document.getElementById('companion-note').innerHTML=`<h3>${note[0]}</h3><p>${note[1]}</p><ul>${note[2].map(t=>`<li>${t}</li>`).join('')}</ul><span class="note-pill">${note[3]}</span>`;renderModal();if(state.page==='capture')attachDrag();}
function openReorder(){const p=currentPaper();openModal('调整题目顺序',`${p.questions.map((q,i)=>`<div class="mini-selected"><span class="mini-number">${i+1}</span><p style="flex:1">${escapeHTML(q.topics.join('、')||'待分类')}</p><button class="btn small" data-action="move-up" data-id="${q.id}" ${!i?'disabled':''} aria-label="上移第${i+1}题">↑</button><button class="btn small" data-action="move-down" data-id="${q.id}" ${i===p.questions.length-1?'disabled':''} aria-label="下移第${i+1}题">↓</button></div>`).join('')}<button class="btn primary full" style="margin-top:18px" data-action="close-modal-render">完成</button>`);}
function requestNavigate(page){if(['gradeResults','review'].includes(state.page)&&state.gradingAttempt&&!state.gradingAttempt.committed&&page!==state.page){openModal('先离开这次核对？',`<p class="subtle">本次尚未确认入库的批改结果会放弃，已保存的练习记录不受影响。</p><div class="bottom-actions"><button class="btn" data-action="close-modal">继续核对</button><button class="btn primary" data-action="leave-grading" data-page="${page}">离开</button></div>`);}else navigate(page);}
function viewGradingRecord(){const p=currentPaper();if(p.attempts.length){state.gradingAttempt=clone(p.attempts[p.attempts.length-1]);navigate('gradeResults');}else openModal('旧版练习记录',`<p class="subtle">这份练习来自旧版演示，只有手动结果，没有拍卷识别明细。你可以重新拍完成卷，记录新的一次练习。</p><button class="btn primary full" style="margin-top:18px" data-action="close-modal">知道了</button>`);}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
 const {action,value,id,page}=target.dataset;
 if(action==='backdrop-close'){if(event.target===target)closeModal();return;}
 switch(action){
 case 'go':requestNavigate(page);break;
 case 'leave-grading':state.gradingAttempt=null;navigate(page);break;
 case 'journey':if(page==='record'){if(data.papers.length){state.paperId=state.paperId||data.papers[data.papers.length-1].id;state.tab='practice';requestNavigate('preview');}else{navigate('practice');toast('先生成一张练习卷，再拍完成卷');}}else requestNavigate(page);break;
 case 'subject':state.subject=value;render();break;
 case 'filter':state.filter=value;render();break;
 case 'library-topic-modal':openModal('按知识点找题',`<div class="chip-row">${chips(['全部',...allTopics()],[state.topic],'library-topic')}</div>`);break;
 case 'library-topic':state.topic=value;state.modal=null;render();break;
 case 'clear-filters':state.subject='全部';state.filter='all';state.search='';state.topic='全部';render();break;
 case 'detail':navigate('detail',{detailId:id,answer:false});break;
 case 'answer':state.answer=!state.answer;render();break;
 case 'edit-meta':openMetadata('question',state.detailId);break;
 case 'draft-meta':openMetadata('draft',id);break;
 case 'batch-meta':openMetadata('batch');break;
 case 'meta-topic':state.metaDraft.topics=toggleValue(state.metaDraft.topics,value);renderMetadata();break;
 case 'meta-cause':state.metaDraft.causes=toggleValue(state.metaDraft.causes,value);renderMetadata();break;
 case 'meta-add-topic':case 'meta-add-cause':{const isTopic=action==='meta-add-topic',field=isTopic?'new-topic':'new-cause',key=isTopic?'topics':'causes',text=document.getElementById(field).value.trim();if(!text){state.metaDraft.error='请先填写内容';renderMetadata();break;}state.metaDraft[key]=cleanTags([...state.metaDraft[key],text]);state.metaDraft[isTopic?'topicInput':'causeInput']='';state.metaDraft.error='';renderMetadata();break;}
 case 'save-metadata':saveMetadata();break;
 case 'toggle-mastered':{const q=data.questions.find(q=>q.id===state.detailId);q.status=q.status==='mastered'?'pending':'mastered';persist();render();toast('掌握情况已更新');break;}
 case 'add-to-paper':{const q=data.questions.find(q=>q.id===state.detailId);state.mode='manual';state.manualSelected.add(q.id);if(state.manualFilters.subject!==q.subject)state.manualFilters.subject='全部';navigate('practice');toast('已加入练习卷选题列表');break;}
 case 'sample-scan':case 'sample-album':navigate('capture',{scanSelected:new Set(),scanDraft:[],hiddenInk:false,tab:'scan'});break;
 case 'scan-pick':if(state.suppressScanClick)break;state.scanSelected.has(id)?state.scanSelected.delete(id):state.scanSelected.add(id);render();break;
 case 'select-all-scan':state.scanSelected=state.scanSelected.size===SCAN_QUESTIONS.length?new Set():new Set(SCAN_QUESTIONS.map(q=>q.id));render();break;
 case 'scan-next':if(state.scanSelected.size)beginClassify();break;
 case 'save-scan':saveScan();break;
 case 'saved-library':navigate('library',{subject:'全部',topic:'全部',search:'',filter:'pending'});break;
 case 'saved-practice':state.manualSelected=new Set(state.savedScanIds);state.mode='manual';state.manualFilters={...defaultFilters(true),subject:'全部'};navigate('practice');break;
 case 'practice-mode':state.mode=value;render();break;
 case 'open-filters':openFilters();break;
 case 'filter-topic':state.filterDraft.topics=toggleValue(state.filterDraft.topics,value);renderFilters();break;
 case 'filter-cause':state.filterDraft.causes=toggleValue(state.filterDraft.causes,value);renderFilters();break;
 case 'filter-reset':state.filterDraft={...defaultFilters(true),subject:'全部'};renderFilters();break;
 case 'apply-filters':{const error=validateFilters(state.filterDraft);if(error){renderFilters(error);break;}state[state.mode==='manual'?'manualFilters':'autoFilters']=clone(state.filterDraft);state.modal=null;render();break;}
 case 'clear-practice-filters':state[state.mode==='manual'?'manualFilters':'autoFilters']={...defaultFilters(true),subject:'全部'};render();break;
 case 'manual-pick':state.manualSelected.has(id)?state.manualSelected.delete(id):state.manualSelected.add(id);render();break;
 case 'clear-selected':state.manualSelected.clear();render();break;
 case 'select-visible':eligible().forEach(q=>state.manualSelected.add(q.id));render();break;
 case 'generate-paper':generatePaper();break;
 case 'open-paper':navigate('preview',{paperId:id,paperAnswers:false,space:'medium',gradingAttempt:null});break;
 case 'paper-view':state.paperAnswers=value==='answer';render();break;
 case 'rename-paper':openModal('给练习卷起个名字',`<label class="field"><span>练习卷标题</span><input id="paper-title" maxlength="24" value="${escapeHTML(currentPaper().title)}"></label><button class="btn primary full" data-action="save-paper-title">保存标题</button>`);break;
 case 'save-paper-title':{const title=document.getElementById('paper-title').value.trim();if(!title)return toast('标题还没有填写');currentPaper().title=title;state.modal=null;persist();render();break;}
 case 'reorder-paper':openReorder();break;
 case 'move-up':case 'move-down':{const qs=currentPaper().questions,i=qs.findIndex(q=>q.id===id),j=i+(action==='move-up'?-1:1);if(j<0||j>=qs.length)break;[qs[i],qs[j]]=[qs[j],qs[i]];persist();openReorder();break;}
 case 'close-modal-render':state.modal=null;render();break;
 case 'print-paper':preparePrint();break;
 case 'print-all':printAllModal();break;
 case 'confirm-print-all':closeModal();preparePrint('all',state.printDuplex);break;
 case 'start-review':if(currentPaper().completed)navigate('reviewDone');else startPhotoAttempt();break;
 case 'new-photo-attempt':startPhotoAttempt();break;
 case 'mock-capture':case 'mock-album':{if(state.page!=='gradeCapture')break;const token=(state.recognitionToken||0)+1,paperId=state.paperId;state.recognitionToken=token;navigate('gradeProcessing');setTimeout(()=>{if(state.page==='gradeProcessing'&&state.paperId===paperId&&state.recognitionToken===token)completeMockGrading();},700);break;}
 case 'grade-item':openGradeItem(id);break;
 case 'grade-verdict':if(!state.gradingAttempt.committed){state.gradeDraft.verdict=value;state.gradeDraft.error='';renderGradeItem();}break;
 case 'save-grade-item':{if(state.gradingAttempt.committed)break;const draft=state.gradeDraft;if(!['correct','wrong','skip'].includes(draft.verdict)){draft.error='请确认这道题是做对、需再练或暂未做';renderGradeItem();break;}draft.recognized=document.getElementById('recognized-answer').value;const item=state.gradingAttempt.items.find(i=>i.questionId===draft.questionId);Object.assign(item,{recognized:draft.recognized,verdict:draft.verdict,reviewed:true});state.modal=null;render();break;}
 case 'commit-grading':commitGrading();break;
 case 'view-grading-record':viewGradingRecord();break;
 case 'manual-review':startManualReview();break;
 case 'review-answer':state.reviewAnswer=!state.reviewAnswer;render();break;
 case 'review-result':state.gradingAttempt.items.find(i=>i.questionId===currentPaper().questions[state.reviewIndex].id).verdict=value;render();break;
 case 'review-prev':if(state.reviewIndex>0){state.reviewIndex--;state.reviewAnswer=false;render();screen.scrollTop=0;}break;
 case 'review-next':if(state.reviewIndex<currentPaper().questions.length-1){state.reviewIndex++;state.reviewAnswer=false;render();screen.scrollTop=0;}else navigate('gradeResults');break;
 case 'settings':navigate('settings');break;
 case 'export-demo':{const blob=new Blob([JSON.stringify({format:'shiti-demo-backup',version:2,demoOnly:true,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='拾题-V2模拟资料备份.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出模拟资料，不包含真实照片');break;}
 case 'reset-confirm':openModal('重新体验一遍？',`<p class="subtle">将清除本演示中新加的题、练习卷及记录，恢复到 11 道示例题和 4 份练习卷。不影响其他资料。</p><div class="bottom-actions"><button class="btn" data-action="close-modal">保留当前数据</button><button class="btn primary" data-action="reset-data">恢复初始演示</button></div>`);break;
 case 'reset-data':data=freshData();state=initialState();persist();render();screen.scrollTop=0;toast('已恢复 V2.4 体验示例');break;
 case 'close-modal':closeModal();break;
 }
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='library-search'){state.search=el.value;const qs=libraryQuestions();document.getElementById('question-list').innerHTML=cards(qs);document.getElementById('question-count').textContent='共 '+qs.length+' 道';}if(el.id==='new-topic'&&state.metaDraft)state.metaDraft.topicInput=el.value;if(el.id==='new-cause'&&state.metaDraft)state.metaDraft.causeInput=el.value;if(el.id==='recognized-answer'&&state.gradeDraft&&!state.gradingAttempt.committed){state.gradeDraft.recognized=el.value;state.gradeDraft.verdict=null;}if(el.id==='filter-from')state.filterDraft.from=el.value;if(el.id==='filter-to')state.filterDraft.to=el.value;});
document.addEventListener('change',event=>{const el=event.target;switch(el.id){case 'hide-ink':state.hiddenInk=el.checked;document.getElementById('worksheet').classList.toggle('hide-ink',el.checked);break;case 'save-subject':state.saveSubject=el.value;break;case 'save-grade':state.saveGrade=el.value;break;case 'practice-count':state.practiceCount=Number(el.value);render();break;case 'paper-space':state.space=el.value;render();break;case 'print-duplex':state.printDuplex=el.checked;printAllModal();break;case 'filter-subject':state.filterDraft.subject=el.value;break;case 'filter-grade':state.filterDraft.grade=el.value;break;case 'filter-range':state.filterDraft.range=el.value;renderFilters();break;case 'filter-from':state.filterDraft.from=el.value;break;case 'filter-to':state.filterDraft.to=el.value;break;case 'filter-mastered':state.filterDraft.includeMastered=el.checked;break;}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal)closeModal();if(event.key==='Tab'&&state.modal){const nodes=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal select,.modal textarea')],first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});

function questionHTML(q){return `<div class="q-content">${STEMS[q.stem]()}</div>`;}
function appHeader(title,note='',back=null,right=''){return `<div class="app-top"><div class="top-left">${back?`<button class="icon-button back" data-action="go" data-page="${back}" aria-label="返回">${icon('back')}</button>`:''}<div><h2>${title}</h2>${note?`<p class="title-note">${note}</p>`:''}</div></div>${right}</div>`;}
function notice(text,warm=false){return `<div class="notice ${warm?'warm':''}">${icon('info')}<span>${text}</span></div>`;}
function scan(){return `${appHeader('拍一张，收好它','从纸上的错题，开始新的练习')}<div class="scan-intro"><div class="scan-visual"><div class="mini-paper"><h4>六年级数学练习</h4><div class="line"></div><div class="line short"></div><div class="selection"><div class="line"></div><div class="line short"></div></div><div class="line"></div><div class="line short"></div></div><div class="scan-badge">${icon('scan')}</div></div><h3>不用抄，框一下就好</h3><p>拍下整张试卷，再选出想收集的题。<br>公式、图形，一起留下来。</p></div><button class="btn primary full" data-action="sample-scan">${icon('camera')} 模拟拍摄一张试卷</button><button class="btn full" data-action="sample-album" style="margin-top:11px">${icon('image')} 模拟从相册选择</button>${notice('这里使用内置示例试卷，不会开启相机，也不会读取你的相册。')}<div class="section-head"><h3>收题小提示</h3></div><div class="card"><p style="font-size:12px;color:#517ca9;line-height:2">① 试卷放平，题目拍清楚<br>② 框完整道题，别漏掉图和选项<br>③ 先收好，知识点可以稍后再补</p></div>`;}
function capture(){return `${appHeader('选出想收集的题','点击题目，或在纸上拖动框选','scan')}<div class="sheet-tools"><span class="subtle">示例试卷 · 第 1 页</span><button class="btn small" data-action="select-all-scan">${state.scanSelected.size===4?'取消全选':'选择全部'}</button></div><div class="worksheet ${state.hiddenInk?'hide-ink':''}" id="worksheet"><h3>六年级数学 · 巩固练习</h3><div class="sheet-meta">班级：六（1）班　姓名：小禾（示例）</div>${SCAN_QUESTIONS.map((q,i)=>`<button class="scan-question ${state.scanSelected.has(q.id)?'selected':''}" data-action="scan-pick" data-id="${q.id}" aria-pressed="${state.scanSelected.has(q.id)}" aria-label="选择第${i+1}题：${q.topic}">${state.scanSelected.has(q.id)?`<span class="selected-mark">${[...state.scanSelected].indexOf(q.id)+1}</span>`:''}<div class="q-content">${i+1}. ${STEMS[q.stem]()}</div><div class="ink">${q.ink}</div></button>`).join('')}</div><label class="toggle-row"><input type="checkbox" id="hide-ink" ${state.hiddenInk?'checked':''}>遮盖示例手写答案 <span class="draft-badge">效果模拟</span></label><p class="subtle" style="line-height:1.7">正式版支持手动遮盖和撤销；这里仅演示处理前后。</p><div class="sticky-action"><button class="btn primary" data-action="scan-next" ${!state.scanSelected.size?'disabled':''}>下一步 · 已选 ${state.scanSelected.size} 道题 ${icon('arrow')}</button></div>`;}
function saved(){return `${appHeader('收好了','给未来的自己留一份练习')}<div class="success"><div class="success-icon">${icon('check')}</div><h3>${state.savedScanIds.length} 道错题，收进来了</h3><p>不用一次学会。<br>下一次，我们再试试看。</p><button class="btn primary full" data-action="saved-library">回到错题本 ${icon('arrow')}</button><button class="btn full" style="margin-top:10px" data-action="saved-practice">用这些题练一练</button><button class="btn ghost full" data-action="go" data-page="scan" style="margin-top:10px">继续拍下一张</button></div>`;}
function attachDrag(){const sheet=document.getElementById('worksheet');let drag=null,box=null;sheet.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||event.button!==0)return;const rect=sheet.getBoundingClientRect();drag={x:event.clientX,y:event.clientY,left:rect.left,top:rect.top,moved:false};});sheet.addEventListener('pointermove',event=>{if(!drag||!(event.buttons&1))return;if(Math.abs(event.clientX-drag.x)+Math.abs(event.clientY-drag.y)<9)return;drag.moved=true;if(!box){box=document.createElement('div');box.className='selection-drag';sheet.appendChild(box);}box.style.left=Math.max(0,Math.min(event.clientX,drag.x)-drag.left)+'px';box.style.top=Math.max(0,Math.min(event.clientY,drag.y)-drag.top)+'px';box.style.width=Math.abs(event.clientX-drag.x)+'px';box.style.height=Math.abs(event.clientY-drag.y)+'px';});sheet.addEventListener('pointerup',event=>{if(!drag)return;if(drag.moved){const left=Math.min(drag.x,event.clientX),right=Math.max(drag.x,event.clientX),topY=Math.min(drag.y,event.clientY),bottom=Math.max(drag.y,event.clientY);sheet.querySelectorAll('.scan-question').forEach(el=>{const r=el.getBoundingClientRect();if(r.left<right&&r.right>left&&r.top<bottom&&r.bottom>topY)state.scanSelected.add(el.dataset.id);});state.suppressScanClick=true;render();setTimeout(()=>{state.suppressScanClick=false;},0);}box?.remove();box=null;drag=null;});sheet.addEventListener('pointerleave',()=>{box?.remove();box=null;drag=null;});}
function historyTime(h){if(h.recordedAt)return Number(h.recordedAt);const stamp=String(h.attemptId||'').match(/(\d{13})/);if(stamp)return Number(stamp[1]);const full=String(h.date||'');if(/^\d{4}-\d{2}-\d{2}/.test(full))return new Date(full+'T00:00:00').getTime()||0;const parts=full.match(/(\d{1,2})月(\d{1,2})日/);return parts?new Date(new Date().getFullYear(),Number(parts[1])-1,Number(parts[2])).getTime():0;}
function migrateDataV21Base(stored){const questions=stored.questions.map(normalizeQuestion);const papers=(stored.papers||[]).map(p=>({...p,questions:p.questions.map(normalizeQuestion),attempts:p.attempts||[],gradingDraft:p.gradingDraft||null}));for(const p of papers)for(const a of p.attempts)for(const item of a.items||[]){const q=questions.find(q=>q.id===item.questionId);if(!q||!['correct','wrong','skip'].includes(item.verdict)||q.history.some(h=>h.attemptId===a.id))continue;q.history.push({date:a.date,result:item.verdict,source:a.source,attemptId:a.id,paperId:p.id,recordedAt:a.confirmedAt||a.createdAt||historyTime({attemptId:a.id,date:a.date}),countsAsPractice:item.verdict!=='skip'});}questions.forEach(q=>q.history.sort((a,b)=>historyTime(a)-historyTime(b)));return {...stored,schemaVersion:3,questions,papers,counter:Math.max(1,Number(stored.counter)||1),topicCatalog:cleanTags([...(stored.topicCatalog||[]),...TOPICS,...questions.flatMap(q=>q.topics)]),causeCatalog:cleanTags([...(stored.causeCatalog||[]),...CAUSES,...questions.flatMap(q=>q.causes)])};}
function latestResult(q){return q.history.reduce((latest,h)=>!latest||historyTime(h)>=historyTime(latest)?h:latest,null);}
function practiceCountFor(q){return q.history.filter(h=>h.result==='correct'||h.result==='wrong').length;}
function pendingGradingFor(questionId){const candidates=data.papers.filter(p=>p.gradingDraft&&!p.gradingDraft.committed&&p.gradingDraft.items.some(i=>i.questionId===questionId));return candidates.sort((a,b)=>(b.gradingDraft.createdAt||0)-(a.gradingDraft.createdAt||0))[0]||null;}
function historyPaper(q,h){return data.papers.find(p=>p.id===h.paperId||p.attempts.some(a=>a.id===h.attemptId&&a.items.some(i=>i.questionId===q.id)));}
function lastResultHTML(q){const last=latestResult(q),pending=pendingGradingFor(q.id);return `<div class="last-result"><span class="tag ${last?.result==='wrong'?'orange':'gray'}">${last?'上次：'+resultLabel(last.result):'尚未重做'}</span>${last?`<span class="subtle">${escapeHTML(last.date)}</span>`:''}${pending?'<span class="tag orange">批改待核对</span>':''}</div>`;}
function libraryQuestionsV21Base(){const resultFilter=state.resultFilter||'all';return data.questions.filter(q=>(state.subject==='全部'||q.subject===state.subject)&&(state.filter==='all'||q.status===state.filter)&&(state.topic==='全部'||q.topics.includes(state.topic))&&(resultFilter==='all'||(resultFilter==='pending'?Boolean(pendingGradingFor(q.id)):latestResult(q)?.result===resultFilter))&&(!state.search||[...q.topics,...q.causes,q.grade,q.subject,q.source,STEMS[q.stem]().replace(/<[^>]*>/g,'')].join(' ').includes(state.search)));}
function cardsV21Base(qs){if(!qs.length)return `<div class="empty">${icon('folder')}<p>没有符合条件的题目</p><button class="btn soft" style="margin-top:14px" data-action="clear-filters">查看全部错题</button></div>`;return qs.map(q=>`<button class="card q-card" data-action="detail" data-id="${q.id}"><div class="q-top"><div class="tag-row">${tagsHTML(q.topics)}</div><span class="tag ${q.status==='mastered'?'gray':'orange'}">${q.status==='mastered'?'已掌握':'待巩固'}</span></div>${questionHTML(q)}${lastResultHTML(q)}<div class="q-foot"><span>${escapeHTML(q.subject)} · ${escapeHTML(q.grade)} · ${escapeHTML(q.addedAt.slice(5))} 加入</span>${icon('chevron')}</div></button>`).join('');}
function libraryV21View(){const html=libraryV2Base();const filters=`<div class="result-filter"><span class="subtle">最近结果 / 核对进度</span><div class="chip-row">${[['all','全部'],['wrong','再练练'],['skip','暂未做'],['correct','做对了'],['pending','待核对']].map(([v,t])=>`<button class="chip ${(state.resultFilter||'all')===v?'active':''}" data-action="library-result" data-value="${v}">${t}</button>`).join('')}</div></div>`;return html.replace('<div class="section-head"><h3>一点点，积累起来</h3>',filters+'<div class="section-head"><h3>一点点，积累起来</h3>');}
function detailV21View(){const q=data.questions.find(q=>q.id===state.detailId);if(!q)return detailV2Base();const pending=pendingGradingFor(q.id),skips=q.history.filter(h=>h.result==='skip').length;const heading=`<div class="card"><p class="field-title" style="margin-top:0">最近一次结果</p>${lastResultHTML(q)}<p class="subtle" style="margin-top:9px">掌握情况与单次结果分开记录；暂未做不会计错。</p></div>${pending?`<div class="card pending-record"><h3 style="font-size:14px">有一份批改等待核对</h3><p class="subtle" style="margin:8px 0">${escapeHTML(pending.title)}<br>草稿已暂存，尚未加入练习统计。</p><button class="btn soft full" data-action="resume-grading" data-id="${pending.id}">继续核对这份批改</button></div>`:''}${q.classification?notice(q.classification.state==='manual'?'分类来源：已手动调整。':'分类来源：已采用自动建议（本 Demo 为模拟建议）。'):''}`;const history=`<div class="section-head"><h3>练习与未作答记录</h3><span class="subtle">练习 ${practiceCountFor(q)} 次 · 暂未做 ${skips} 次</span></div><div class="card">${q.history.length?q.history.slice().reverse().map(h=>{const p=historyPaper(q,h);return `<div class="history-row"><div><strong>${resultLabel(h.result)}</strong><span class="subtle">${escapeHTML(h.date)}${h.result==='skip'?' · 未计入练习':h.source==='photo-demo'?' · 拍卷确认':''}</span></div>${p?`<button class="text-button" data-action="open-history-record" data-id="${p.id}" data-attempt="${escapeHTML(h.attemptId||'')}">查看批改</button>`:''}</div>`;}).join(''):'<p class="subtle">还没有重做记录。暂未做也会保留，但不计入有效练习。</p>'}</div>`;return detailV2Base().replace('<div class="detail-image">',heading+'<div class="detail-image">').replace(/<div class="section-head"><h3>我练过的足迹<\/h3>[\s\S]*?(?=<button class="btn primary full" data-action="add-to-paper">)/,history);}
function beginClassify(){state.scanDraft=SCAN_QUESTIONS.filter(q=>state.scanSelected.has(q.id)).map(q=>normalizeQuestion({...clone(q),topics:q.id==='s2'?['百分数','应用题']:[q.topic],causes:[],history:[],classification:{state:'suggested',origin:'demo',subject:'数学',grade:'六年级',gradeSource:'示例卷标题',topics:q.id==='s2'?['百分数','应用题']:[q.topic]}}));state.saveSubject='数学';state.saveGrade='六年级';navigate('classify');}

function saveScan(){if(!state.scanDraft.length)return;const stamp=Date.now();const qs=state.scanDraft.map((q,i)=>normalizeQuestion({...clone(q),id:`collected-${stamp}-${data.counter++}-${i}`,subject:state.saveSubject,grade:state.saveGrade,classification:{...q.classification,state:q.classification?.state==='manual'||state.saveSubject!==q.classification?.subject||state.saveGrade!==q.classification?.grade?'manual':'accepted',subject:state.saveSubject,grade:state.saveGrade},source:'新收集 · 六年级巩固练习',addedAt:localDate(),status:'pending',ink:state.hiddenInk?'':q.ink,history:[]}));data.questions.unshift(...qs);data.topicCatalog=cleanTags([...data.topicCatalog,...qs.flatMap(q=>q.topics)]);data.causeCatalog=cleanTags([...data.causeCatalog,...qs.flatMap(q=>q.causes)]);state.savedScanIds=qs.map(q=>q.id);state.scanDraft=[];state.scanSelected=new Set();persist();navigate('saved');}
function saveGradingDraft(){const p=currentPaper(),a=state.gradingAttempt;if(p&&a&&!a.committed){p.gradingDraft=clone(a);persist();}}

function commitGrading(){const p=currentPaper(),a=state.gradingAttempt;if(!p||!a)return;if(a.committed||p.attempts.some(previous=>previous.id===a.id)){navigate('reviewDone');return;}if(a.items.length!==p.questions.length||gradingPending()){toast('请先确认所有题目的批改结果');return;}const results={};a.confirmedAt=Date.now();for(const item of a.items){results[item.questionId]=item.verdict;const q=data.questions.find(q=>q.id===item.questionId);if(q){q.history.push({date:a.date,result:item.verdict,source:a.source,attemptId:a.id,paperId:p.id,recordedAt:a.confirmedAt,countsAsPractice:item.verdict!=='skip'});if(item.verdict==='wrong')q.status='pending';}}a.committed=true;p.attempts.push(clone(a));p.results=results;p.completed=true;p.gradingDraft=null;persist();navigate('reviewDone');}
function requestNavigate(page){if(['gradeResults','review'].includes(state.page)&&state.gradingAttempt&&!state.gradingAttempt.committed&&page!==state.page){saveGradingDraft();openModal('稍后继续核对？',`<p class="subtle">本次结果已暂存，还没计入练习。可以从“错题本 → 待核对”或这份练习卷继续核对。</p><div class="bottom-actions"><button class="btn" data-action="close-modal">继续核对</button><button class="btn primary" data-action="leave-grading" data-page="${page}">暂存并离开</button></div>`);}else navigate(page);}

function hasPendingDraft(p){return Boolean(p.gradingDraft&&!p.gradingDraft.committed);}
function hasPaperResults(p){return Boolean(p.completed||(p.attempts||[]).length||Object.keys(p.results||{}).length);}
function deletionBlockReason(kind,item){
 if(!item||item.deletedAt)return '内容已不存在或已移入最近删除，请刷新后重试';
 if(kind==='paper')return hasPendingDraft(item)?'批改待核对，暂不可删除':hasPaperResults(item)?'已记录练习结果，暂不可删除':'';
 if(kind!=='question')return '无法识别要删除的内容';
 if(pendingGradingFor(item.id))return '有批改待核对，暂不可删除';
 const latest=latestResult(item);
 return !latest?'尚未重做，暂不可删除':latest.result==='skip'?'':resultLabel(latest.result)+'，暂不可删除';
}
function deletionCheck(kind,ids){
 const collection=kind==='paper'?data.papers:kind==='question'?data.questions:[],unique=[...new Set(Array.isArray(ids)?ids:[])];
 if(!unique.length)return {items:[],blocked:[{reason:'请先选择要删除的内容'}]};
 const items=unique.map(id=>collection.find(item=>item.id===id));
 return {items,blocked:items.map(item=>({reason:deletionBlockReason(kind,item)})).filter(entry=>entry.reason)};
}
function rejectDeletion(check){
 state.deleteDraft=null;state.deleteSelection=new Set();state.paperDeleteSelection=new Set();render();
 const reasons=cleanTags(check.blocked.map(entry=>entry.reason));
 openModal('暂不能删除',`<p class="subtle">有 ${check.blocked.length} 项不符合删除条件，本次未删除任何内容。请根据最新状态重新选择。</p><ul class="delete-reasons">${reasons.map(reason=>`<li>${escapeHTML(reason)}</li>`).join('')}</ul><button class="btn primary full" data-action="close-modal">知道了</button>`);
 return false;
}
function deleteControl(kind,item,label,full=false){
 const reason=deletionBlockReason(kind,item);
 return `<div class="delete-control ${full?'full':''}"><button class="${full?'btn ghost full':'text-button'} delete-link" data-action="request-delete" data-kind="${kind}" data-id="${escapeHTML(item.id)}" ${reason?'disabled aria-disabled="true"':''}>${label}</button>${reason?`<p class="delete-note">${escapeHTML(reason)}</p>`:''}</div>`;
}

function migrateData(stored){const migrated=migrateDataV21Base(stored);let maximum=0;migrated.papers.forEach((p,i)=>{const titleMatch=String(p.title||'').match(/巩固练习\s*(\d+)$/),idMatch=String(p.id||'').match(/-(\d+)$/);const serial=Number(p.serialNumber)||(titleMatch?Number(titleMatch[1]):0)||(idMatch?Number(idMatch[1]):0)||i+1;p.serialNumber=serial;maximum=Math.max(maximum,serial);});migrated.nextPaperSerial=Math.max(maximum+1,Number(stored.nextPaperSerial)||1);migrated.schemaVersion=4;return migrated;}

function generatePaper(){const qs=chosenQuestions();if(!qs.length)return toast('请先选择题目');const serial=data.nextPaperSerial++,subjects=cleanTags(qs.map(q=>q.subject));const p={id:`paper-${Date.now()}-${serial}`,serialNumber:serial,title:`我的${subjects.length===1?subjects[0]:'综合'}巩固练习${serial}`,createdAt:Date.now(),questions:clone(qs),completed:false,results:{},attempts:[],gradingDraft:null};data.papers.push(p);persist();state.practiceSection='papers';state.tab='practice';navigate('preview',{paperId:p.id,paperAnswers:false,space:'medium',gradingAttempt:null});}
function practiceSection(){return state.practiceSection||(activePapers().length?'papers':'compose');}
function practiceTabs(){const section=practiceSection();return `<div class="practice-tabs" aria-label="练一练分区"><button class="${section==='compose'?'active':''}" data-action="practice-section" data-value="compose" aria-pressed="${section==='compose'}">生成练习卷</button><button class="${section==='papers'?'active':''}" data-action="practice-section" data-value="papers" aria-pressed="${section==='papers'}">我的练习卷 <span>${activePapers().length}</span></button></div>`;}

function paperRows(){
 const ps=matchingPapers();
 if(!ps.length)return `<div class="empty">${icon('practice')}<p>${activePapers().length?'没有符合条件的练习卷':'还没有练习卷，先选几道题吧'}</p><button class="btn soft" style="margin-top:15px" data-action="practice-section" data-value="compose">去选题生成练习卷</button></div>`;
 return ps.map(p=>{const reason=deletionBlockReason('paper',p),selected=state.paperDeleteSelection?.has(p.id)&&!reason;
 return `<article class="paper-tile ${state.paperManaging?'manage-mode':''}">${state.paperManaging?`<button class="paper-select-toggle" data-action="paper-select-delete" data-id="${p.id}" aria-label="${escapeHTML((reason?'不可选择：':'选择练习卷：')+p.title+(reason?'，'+reason:''))}" aria-pressed="${Boolean(selected)}" ${reason?'disabled aria-disabled="true"':''}><span class="check">✓</span></button>`:''}<button class="paper-tile-main" data-action="open-paper" data-id="${p.id}"><span class="paper-icon">${icon('practice')}</span><div>${p.demoSample?`<p class="paper-sample-note">体验示例 · ${escapeHTML(p.demoNote)}</p>`:''}<h3>${escapeHTML(p.title)}</h3><p>${p.questions.length} 道题 · 出卷序号 ${p.serialNumber} · ${p.attempts.length} 次记录</p><span class="tag ${paperStage(p)==='pending'?'orange':paperStage(p)==='recorded'?'gray':''}">${paperStageLabel(p)}</span></div>${icon('chevron')}</button><div class="paper-tile-actions"><button class="text-button" data-action="paper-rename" data-id="${p.id}">修改名称</button>${deleteControl('paper',p,'删除')}</div></article>`;}).join('');
}
function practice(){
 if(!state.paperDeleteSelection)state.paperDeleteSelection=new Set();
 if(practiceSection()==='compose')return practiceV2Base().replace('<div class="mode-switch">',practiceTabs()+'<div class="mode-switch">').replace(/<div class="section-head"><h3>我的练习卷<\/h3>[\s\S]*$/,'');
 return `${appHeader('练一练','先出卷打印，做完后再回来拍照')}${practiceTabs()}${demoSampleBanner()}<div class="paper-manage-heading"><h3>我的练习卷</h3><div class="paper-manage-tools"><button class="btn small soft" data-action="paper-manage">${state.paperManaging?'完成管理':'管理练习卷'}</button><button class="text-button" data-action="open-trash" data-kind="paper">最近删除</button></div></div><div class="search">${icon('search')}<input id="paper-search" type="search" placeholder="搜索练习卷名称" aria-label="搜索练习卷" value="${escapeHTML(state.paperSearch||'')}"></div><div class="chip-row">${[['all','全部'],['todo','待完成'],['pending','待核对'],['recorded','已记录']].map(([v,t])=>`<button class="chip ${(state.paperStatus||'all')===v?'active':''}" data-action="paper-status" data-value="${v}">${t}</button>`).join('')}</div><p class="subtle" id="paper-list-count">共 ${matchingPapers().length} 份 · ${state.paperManaging?'只可勾选待完成卷':'点开练习卷，可打印、拍完成卷或查看记录'}</p><div id="paper-management">${paperManagementHTML()}</div><div id="paper-delete-footer">${paperDeleteFooterHTML()}</div><div id="paper-list" style="margin-top:14px">${paperRows()}</div>`;
}
function preview(){const p=currentPaper();if(!p)return previewV2Base();if(p.deletedAt)return `${appHeader('练习卷已删除','历史结果保留，可从最近删除恢复','practice')}<div class="card"><h3>${escapeHTML(p.title)}</h3><p class="subtle" style="margin:12px 0">这份卷子已移入最近删除，不能继续修改、打印或拍照。恢复后可继续使用。</p><button class="btn primary full" data-action="restore-deleted" data-kind="paper" data-id="${p.id}">恢复这份练习卷</button></div>`;const title=`<button class="paper-title-edit" data-action="rename-paper"><strong>${escapeHTML(p.title)}</strong><span>点击修改名称</span></button><div class="paper-stage-note"><span class="tag">${paperStageLabel(p)}</span><p>${hasPendingDraft(p)?'批改草稿已暂存，可以继续核对。':hasPaperResults(p)?'已保存练习记录，可以重新打印，再做一次。':'第一阶段：预览、打印，再到纸上做题。生成后已经自动保存，不必现在拍照。'}</p></div>`;let html=previewV2Base().replace('<div class="mode-switch">',title+'<div class="mode-switch">');html=html.replace('拍完成卷，记录结果','做完后，拍完成卷核对');return html+`<button class="btn full" style="margin-top:12px" data-action="return-to-papers">稍后再做，回到我的练习卷</button><p class="subtle" style="line-height:1.8;margin:10px 0">做完后：练一练 → 我的练习卷 → 找到这份卷 → 拍完成卷核对。打印窗口打开不代表已经完成练习。</p>${deleteControl('paper',p,'删除这份练习卷',true)}`;}
function cards(qs){
 if(!state.libraryManaging||!qs.length)return cardsV21Base(qs);
 return qs.map(q=>{const reason=deletionBlockReason('question',q),selected=state.deleteSelection?.has(q.id)&&!reason;
 return `<button class="pick-card delete-pick ${selected?'active':''}" data-action="question-select-delete" data-id="${q.id}" aria-pressed="${Boolean(selected)}" ${reason?'disabled aria-disabled="true"':''}><span class="check">✓</span><div>${questionHTML(q)}<div class="tag-row" style="margin-top:8px">${tagsHTML(q.topics)}</div>${lastResultHTML(q)}<small>${escapeHTML(q.subject)} · ${escapeHTML(q.grade)}</small><small class="${reason?'delete-note':'delete-allowed'}">${escapeHTML(reason||'可删除 · 最近确认结果为暂未做')}</small></div></button>`;}).join('');
}
function library(){if(!state.deleteSelection)state.deleteSelection=new Set();const controls=`<div class="library-actions"><button class="btn small soft" data-action="question-manage">${state.libraryManaging?'完成管理':'管理错题'}</button><button class="text-button" data-action="open-trash" data-kind="question">最近删除</button></div>`;let html=libraryV21View().replace('<section class="hero">',controls+demoSampleBanner()+(state.libraryManaging?notice('仅最近确认结果为暂未做、且没有待核对批改的错题可删除。尚未重做不属于暂未做。'):'')+'<section class="hero">');if(state.libraryManaging){const selected=[...state.deleteSelection].filter(id=>activeQuestions().some(q=>q.id===id));html+=`<div class="sticky-action"><div class="manage-footer"><span>已选 ${selected.length} 道</span><button class="btn danger" data-action="request-delete-selected" ${!selected.length?'disabled':''}>删除所选</button></div></div>`;}return html;}
function detail(){const q=data.questions.find(q=>q.id===state.detailId);if(!q)return detailV21View();if(q.deletedAt)return `${appHeader('错题已删除','从最近删除恢复后可继续使用','library')}<div class="card">${questionHTML(q)}<button class="btn primary full" style="margin-top:17px" data-action="restore-deleted" data-kind="question" data-id="${q.id}">恢复这道错题</button></div>`;return detailV21View()+`${deleteControl('question',q,'删除这道错题',true)}`;}
function settings(){return settingsV2Base().replace('<div class="settings-list">','<div class="settings-list"><button data-action="open-trash" data-kind="question"><span>最近删除 · 错题与练习卷</span>'+icon('chevron')+'</button>');}
function gradeResults(){const html=gradeResultsV2Base();return currentPaper()?.deletedAt?notice('所属练习卷已删除，这里仅保留历史批改对照。恢复后可继续使用。')+html:html;}
function requestDelete(kind,ids){
 state.deleteDraft=null;
 const check=deletionCheck(kind,ids);if(check.blocked.length)return rejectDeletion(check);
 state.deleteDraft={kind,ids:check.items.map(item=>item.id)};
 openModal(kind==='paper'?`删除 ${check.items.length} 份待完成练习卷？`:`删除 ${check.items.length} 道暂未做错题？`,`<p class="subtle" style="line-height:1.9">${kind==='paper'?'仅待完成练习卷可删除。所选卷将移入最近删除，题库中的错题和既有练习记录保留。':'这些题最近一次确认结果均为暂未做，且没有待核对批改。删除后不再出现在题库和新组卷选题中；历史练习卷快照、分类和所有结果仍然保留。'}<br><br>可以在最近删除中恢复。本 Demo 不自动永久清理。</p><div class="bottom-actions"><button class="btn" data-action="close-modal">取消</button><button class="btn danger" data-action="confirm-delete">移入最近删除</button></div>`);
 state.modal.deletionConfirmation=true;
}
function softDeleteItems(kind,ids){
 const check=deletionCheck(kind,ids);if(check.blocked.length)return rejectDeletion(check);
 const valid=new Set(check.items.map(item=>item.id)),deletedAt=Date.now();
 check.items.forEach(item=>{item.deletedAt=deletedAt;});
 if(kind==='question'){valid.forEach(id=>{state.manualSelected.delete(id);state.deleteSelection?.delete(id);});state.libraryManaging=false;}
 if(kind==='paper'){state.paperDeleteSelection=new Set();state.paperManaging=false;if(valid.has(state.paperId))state.gradingAttempt=null;}
 state.deleteDraft=null;state.modal=null;persist();
 if(kind==='paper'){state.practiceSection='papers';navigate('practice');}else navigate('library');
 toast('已移入最近删除，可恢复');return true;
}
function restoreDeleted(kind,id){const item=(kind==='paper'?data.papers:data.questions).find(item=>item.id===id);if(!item?.deletedAt)return;item.deletedAt=null;persist();render();toast('已恢复，原有分类与记录保留');}
function trash(){const kind=state.trashKind||'question',qs=data.questions.filter(q=>q.deletedAt),ps=data.papers.filter(p=>p.deletedAt),items=kind==='paper'?ps:qs;return `${appHeader('最近删除','可恢复，本演示不自动永久清理',state.trashBack||'library')}<div class="mode-switch"><button class="${kind==='question'?'active':''}" data-action="trash-kind" data-value="question">错题 ${qs.length}</button><button class="${kind==='paper'?'active':''}" data-action="trash-kind" data-value="paper">练习卷 ${ps.length}</button></div>${notice('删除和恢复各自独立。删除错题不改动历史卷；删除卷子不删除题库和已经确认的结果。')}${items.length?items.slice().reverse().map(item=>`<div class="card"><div style="margin-bottom:13px">${kind==='paper'?`<h3 style="font-size:15px">${escapeHTML(item.title)}</h3><p class="subtle">${item.questions.length} 道题 · 原状态：${paperStageLabel(item)}</p>`:questionHTML(item)}</div><button class="btn soft full" data-action="restore-deleted" data-kind="${kind}" data-id="${item.id}">恢复${kind==='paper'?'练习卷':'错题'}</button></div>`).join(''):'<div class="empty">这里没有最近删除的内容</div>'}`;}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const {action,value,id,kind}=target.dataset;switch(action){case 'practice-section':state.paperManaging=false;state.paperDeleteSelection=new Set();state.practiceSection=value;state.tab='practice';navigate('practice');break;case 'return-to-papers':state.practiceSection='papers';state.paperStatus='all';state.paperSearch='';navigate('practice');break;case 'paper-status':state.paperStatus=value;render();break;
 case 'paper-manage':state.paperManaging=!state.paperManaging;state.paperDeleteSelection=new Set();render();break;
 case 'paper-select-delete':{const p=data.papers.find(p=>p.id===id),reason=deletionBlockReason('paper',p);if(reason){toast(reason);break;}if(!state.paperDeleteSelection)state.paperDeleteSelection=new Set();state.paperDeleteSelection.has(id)?state.paperDeleteSelection.delete(id):state.paperDeleteSelection.add(id);render();break;}
 case 'paper-select-visible':if(!state.paperDeleteSelection)state.paperDeleteSelection=new Set();matchingPapers().filter(p=>!deletionBlockReason('paper',p)).forEach(p=>state.paperDeleteSelection.add(p.id));render();break;
 case 'paper-clear-selection':state.paperDeleteSelection=new Set();render();break;
 case 'request-delete-selected-papers':requestDelete('paper',[...(state.paperDeleteSelection||new Set())]);break;case 'paper-rename':{const p=data.papers.find(p=>p.id===id&&!p.deletedAt);if(!p)return;state.paperId=p.id;openModal('修改练习卷名称',`<label class="field"><span>名称</span><input id="paper-title" maxlength="24" value="${escapeHTML(p.title)}"></label><p class="subtle">改名不会占用新的出卷序号。</p><button class="btn primary full" style="margin-top:14px" data-action="save-paper-title">保存名称</button>`);break;}case 'add-to-paper':case 'saved-practice':state.practiceSection='compose';render();break;case 'question-manage':state.libraryManaging=!state.libraryManaging;state.deleteSelection=new Set();render();break;case 'question-select-delete':{const q=data.questions.find(q=>q.id===id),reason=deletionBlockReason('question',q);if(reason){toast(reason);break;}state.deleteSelection.has(id)?state.deleteSelection.delete(id):state.deleteSelection.add(id);render();break;}case 'request-delete':requestDelete(kind,[id]);break;case 'request-delete-selected':requestDelete('question',[...(state.deleteSelection||new Set())]);break;case 'confirm-delete':if(state.deleteDraft&&state.modal?.deletionConfirmation)softDeleteItems(state.deleteDraft.kind,state.deleteDraft.ids);break;case 'close-modal':case 'close-modal-render':state.deleteDraft=null;break;case 'backdrop-close':if(event.target===target)state.deleteDraft=null;break;case 'open-trash':state.trashKind=kind||'question';state.trashBack=state.page==='practice'?'practice':'library';navigate('trash');break;case 'trash-kind':state.trashKind=value;render();break;case 'restore-deleted':restoreDeleted(kind,id);break;}});
document.addEventListener('input',event=>{if(event.target.id==='paper-search'){state.paperSearch=event.target.value;document.getElementById('paper-list').innerHTML=paperRows();document.getElementById('paper-list-count').textContent=`共 ${matchingPapers().length} 份`;document.getElementById('paper-management').innerHTML=paperManagementHTML();document.getElementById('paper-delete-footer').innerHTML=paperDeleteFooterHTML();}});
NOTES.practice=['选题与找卷，分开更清楚','顶部随时切换生成练习卷和我的练习卷。',['先生成并打印，再去纸上做题','以后从我的练习卷找回，拍完成卷','名称可改，待完成卷可单个或批量删除'],'试试：生成后返回我的练习卷'];
NOTES.preview=['先打印，做完后再回来','这份卷子已自动保存，现在不需要拍照。',['点击卷名可以直接改名','打印后可退出，纸上做完再回来','同卷重印不占号，新一次拍卷保留历史'],'试试：点“稍后再做”回到卷列表'];
NOTES.trash=['删错了，也能找回来','错题和练习卷分别恢复，保留原有记录。',['移入后从活跃列表隐藏','历史卷与已确认结果不会级联丢失','当前原型不自动永久清理'],'试试：恢复一题或一份卷'];

// Demo fixtures only. Native App first launch must start with the user's own data.
function freshData(){return addDeletionSamples(freshDataV2Base());}
function addDeletionSamples(dataset){
 if(dataset.deletionSampleVersion===1)return dataset;
 const now=Date.now(),confirmedAt=now-2*86400000;
 let serial=Math.max(Number(dataset.nextPaperSerial)||1,1,...dataset.papers.map(p=>(Number(p.serialNumber)||0)+1));
 const sampleQuestions=[['a','ratio','比和比例'],['b','circle','圆'],['pending','percent','百分数']].map(([suffix,stem,topic],index)=>{
  const id='demo-delete-v24-q-'+suffix,existing=dataset.questions.find(q=>q.id===id);
  if(existing)return existing;
  const original=dataset.questions.find(q=>q.stem===stem)||SEED_QUESTIONS.find(q=>q.stem===stem);
  const q=normalizeQuestion({...clone(original),id,topics:[topic],causes:['方法不会'],subject:'数学',grade:'六年级',source:'删除体验示例 · '+(suffix==='pending'?'另有批改待核对':'已确认暂未做'),status:'pending',addedAt:localDate(-3),history:[],demoSample:true});
  dataset.questions.push(q);return q;
 });
 function paper(suffix,questions,note){
  const id='demo-delete-v24-paper-'+suffix,existing=dataset.papers.find(p=>p.id===id);
  if(existing)return existing;
  const sequence=serial++,p={id,serialNumber:sequence,title:`我的数学巩固练习${sequence}`,createdAt:now,questions:clone(questions),completed:false,results:{},attempts:[],gradingDraft:null,demoSample:true,demoNote:note};
  dataset.papers.push(p);return p;
 }
 const recorded=paper('recorded',sampleQuestions,'已记录示例 · 不可删除');
 const attempt={id:'demo-delete-v24-attempt',date:localDate(-2),source:'photo-demo',createdAt:confirmedAt,confirmedAt,committed:true,photoCount:1,items:sampleQuestions.map(q=>({questionId:q.id,recognized:'未作答（模拟）',suggested:'skip',verdict:'skip',reviewed:true,reason:'示例已核对，确认当次未作答'}))};
 if(!recorded.attempts.some(a=>a.id===attempt.id)){
  recorded.attempts.push(attempt);recorded.completed=true;
  for(const q of sampleQuestions){recorded.results[q.id]='skip';if(!q.history.some(h=>h.attemptId===attempt.id))q.history.push({date:attempt.date,result:'skip',recordedAt:confirmedAt,source:'photo-demo',attemptId:attempt.id,paperId:recorded.id,countsAsPractice:false});}
  recorded.questions=clone(sampleQuestions);
 }
 const waiting=paper('pending',[sampleQuestions[2]],'待核对示例 · 不可删除');
 waiting.gradingDraft={id:'demo-delete-v24-draft',date:localDate(-1),source:'photo-demo',createdAt:now-86400000,committed:false,photoCount:1,items:[{questionId:sampleQuestions[2].id,recognized:'字迹不清，等待核对',suggested:null,verdict:null,reviewed:false,reason:'示例批改尚未确认'}]};
 paper('todo-a',[dataset.questions[0],sampleQuestions[0]],'待完成示例 · 可批量删除');
 paper('todo-b',[dataset.questions[1]||sampleQuestions[1],sampleQuestions[1]],'待完成示例 · 可批量删除');
 dataset.nextPaperSerial=serial;dataset.deletionSampleVersion=1;
 return dataset;
}
function demoSampleBanner(){return `<aside class="demo-sample-banner"><strong>体验示例 · 删除与恢复</strong><p>${data.deletionSampleVersion===1?'已备好暂未做错题、待完成卷，以及不可删除的对照样例。':'可补充 3 道错题和 4 份练习卷，体验可删除与不可删除的区别；保留已有内容。'}</p><div>${data.deletionSampleVersion!==1?'<button class="btn small primary" data-action="load-delete-samples">补充体验数据</button>':'<button class="text-button" data-action="sample-show-questions">看暂未做错题</button><button class="text-button" data-action="sample-show-papers">看待完成练习卷</button>'}</div></aside>`;}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
 switch(target.dataset.action){
  case 'load-delete-samples':if(data.deletionSampleVersion===1)return;addDeletionSamples(data);persist();render();toast('已补充体验示例，原有数据保留');break;
  case 'sample-show-questions':state.subject='数学';state.filter='all';state.resultFilter='skip';state.topic='全部';state.search='';state.libraryManaging=false;navigate('library');break;
  case 'sample-show-papers':state.practiceSection='papers';state.paperStatus='todo';state.paperSearch='';navigate('practice');break;
 }
});

try{document.getElementById('brand-icon').innerHTML=icon('book');document.getElementById('status-icons').innerHTML=icon('signal')+icon('wifi')+icon('battery');render();}catch(error){screen.innerHTML=`<div class="card"><h3>演示暂时未能加载</h3><p class="subtle" style="margin:12px 0">${escapeHTML(error.message)}</p><button class="btn primary full" data-action="reset-confirm">恢复初始演示后重试</button></div>`;console.error(error);}

</script>
