name: iOS Tests and IPA
on:
  push:
    branches: [main, feat/native-mvp]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Domain and persistence tests
        run: swift test
      - name: Generate project
        run: python3 scripts/generate_project.py
      - name: Build unsigned iPhone app
        run: xcodebuild -project Pickt.xcodeproj -scheme Pickt -configuration Release -sdk iphoneos -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Pickt.app build/ipa/Payload/
          cd build/ipa
          zip -qr ../Pickt-unsigned.ipa Payload
          cd ..
          shasum -a 256 Pickt-unsigned.ipa > SHA256SUMS.txt
          printf 'Commit: %s\nMinimum iOS: 15.5\nUnsigned: re-sign before sideloading\n' "$GITHUB_SHA" > BUILD.txt
          xcodebuild -version >> BUILD.txt
          swift --version >> BUILD.txt
          plutil -extract CFBundleShortVersionString raw -o - DerivedData/Build/Products/Release-iphoneos/Pickt.app/Info.plist >> BUILD.txt
          test "$(plutil -extract MinimumOSVersion raw -o - DerivedData/Build/Products/Release-iphoneos/Pickt.app/Info.plist)" = "15.5"
      - uses: actions/upload-artifact@v4
        with:
          name: Pickt-unsigned-ipa
          path: |
            build/Pickt-unsigned.ipa
            build/SHA256SUMS.txt
            build/BUILD.txt
      - name: Build simulator and capture empty library
        run: |
          xcodebuild -project Pickt.xcodeproj -scheme Pickt -configuration Debug -sdk iphonesimulator -derivedDataPath build/Simulator CODE_SIGNING_ALLOWED=NO build
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" build/Simulator/Build/Products/Debug-iphonesimulator/Pickt.app
          xcrun simctl launch "$SIM_ID" com.wenna.pickt
          sleep 4
          xcrun simctl io "$SIM_ID" screenshot build/first-launch.png
          xcrun simctl terminate "$SIM_ID" com.wenna.pickt
          xcrun simctl launch "$SIM_ID" com.wenna.pickt --crop-preview
          sleep 3
          xcrun simctl io "$SIM_ID" screenshot build/crop-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: Pickt-simulator-preview
          path: |
            build/first-launch.png
            build/crop-preview.png
