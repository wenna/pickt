<body>
<header class="desktop-header"><div class="brand"><div class="brand-mark" id="brand-icon"></div>拾题 <span style="font-size:10px;font-weight:400;letter-spacing:1px;color:#869080;margin-left:6px">SHITI</span></div><div class="demo-label"><span class="dot"></span>界面与流程演示 <span style="color:#b4bbaa">/</span> 模拟数据</div></header>
<main class="workspace">
<aside class="intro"><div class="eyebrow">A LITTLE BETTER, EVERY DAY</div><h1>把错过的题，<br>变成下一次<br><span>会做的题。</span></h1><p>少一点整理的麻烦，<br>多一点学会的踏实。</p><div class="intro-line"></div><div class="journey" id="journey"></div><div class="intro-foot">为六年级的小小学习者设计<br>手机操作布局 · 电脑也能轻松试用</div></aside>
<section class="device" aria-label="拾题 App 手机交互演示"><div class="island"></div><div class="status"><span>9:41</span><span class="status-right" id="status-icons"></span></div><div class="screen" id="screen"></div><nav class="app-nav" id="app-nav" aria-label="主要功能"></nav><div class="home-indicator"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><div id="modal-root"></div></section>
<aside class="companion"><div class="note-label"><span class="dot"></span>边点边体验</div><div class="note-card" id="companion-note"></div><div class="small-note"><strong>推荐试走一遍</strong><br>拍试卷 → 选择两道题 → 保存分类 → 练一练 → 组卷预览 → 记录结果</div><div class="small-note">示例为虚构的小学数学题。<br>无需登录，不会上传任何资料。<br>你可以放心点击、修改与重置。</div><button class="btn" data-action="reset-confirm">恢复初始演示</button></aside>
</main>
<footer class="desktop-footer">拾题 · 让每一道错题都有下文 &nbsp; / &nbsp; 交互原型，尚未接入扫描、识别或 AI 服务</footer>
<section id="print-root" aria-label="打印内容"></section>
<script>
'use strict';
const ICONS={book:'<path d="M3 4h6a4 4 0 0 1 3 1.5A4 4 0 0 1 15 4h6v15h-6a4 4 0 0 0-3 1.5A4 4 0 0 0 9 19H3z"/><path d="M12 6v14M6 8h3M15 8h3"/>',scan:'<path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4M4 12h16"/>',practice:'<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h4M9 18h6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',settings:'<path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3z"/><circle cx="12" cy="12" r="3"/>',back:'<path d="m15 5-7 7 7 7"/>',chevron:'<path d="m9 5 7 7-7 7"/>',check:'<path d="m5 12 4 4L19 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',camera:'<path d="M4 6h4l2-3h4l2 3h4a1 1 0 0 1 1 1v12H3V7a1 1 0 0 1 1-1z"/><circle cx="12" cy="12" r="4"/>',image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/>',print:'<path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zM16 11h1"/>',leaf:'<path d="M20 3C6 1 1 9 7 16c7 6 15 1 13-13zM5 20 17 7M10 15v-5M10 15h5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',signal:'<path d="M4 19v-4M9 19v-8M14 19V7M19 19V3"/>',wifi:'<path d="M3 8a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0m-9 4a4 4 0 0 1 6 0M12 20h.01"/>',battery:'<rect x="2" y="6" width="18" height="12" rx="2"/><path d="M23 10v4M5 9h12v6H5z"/>',undo:'<path d="M4 4v6h6M4 10a8 8 0 1 1 0 8"/>',spark:'<path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6z"/>',folder:'<path d="M3 5h7l2 3h9v12H3z"/>',heart:'<path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1s-1 7 8 14c9-7 11-11 8-14z"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]||ICONS.book}</svg>`;
const escapeHTML=(text)=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const frac=(a,b)=>`<span class="fraction"><span>${a}</span><span>${b}</span></span>`;
const circle=()=>'<svg class="circle-figure" viewBox="0 0 150 95" role="img" aria-label="半径为4厘米的圆"><circle cx="70" cy="45" r="35" fill="none" stroke="#4d5b49" stroke-width="1.2"/><path d="M70 45h35" stroke="#4d5b49" stroke-width="1"/><circle cx="70" cy="45" r="1.6" fill="#4d5b49"/><text x="76" y="39" font-size="11" fill="#4d5b49">4 cm</text><text x="58" y="59" font-size="10" fill="#4d5b49">O</text></svg>';
const STEMS={fraction:()=>`计算：${frac(3,4)} ÷（${frac(5,6)} − ${frac(1,3)}）`,percent:()=>`一件上衣原价 120 元，现按原价的 85% 出售。现价是多少元？`,ratio:()=>`六（1）班男生与女生的人数比是 2∶3，全班共有 40 人。男生、女生各有多少人？`,circle:()=>`一个圆的半径是 4 cm，它的面积是多少平方厘米？（π 取 3.14）${circle()}`,equation:()=>`解方程：3x + 18 = 60。`,area:()=>`一块长方形菜地，长 12 米，宽 8 米。如果每平方米收获 3 千克白菜，这块地可收获多少千克白菜？`,scanFraction:()=>`计算：${frac(2,3)} × ${frac(9,10)} + ${frac(1,5)}`,scanPercent:()=>`图书角原有 80 本书，新增了原有本数的 25%。现在一共有多少本书？`,scanRatio:()=>`调制一杯 300 mL 的果汁，浓缩液与水的体积比是 1∶4。需要浓缩液多少毫升？`,scanCircle:()=>`一个圆的直径是 10 cm，求这个圆的周长。（π 取 3.14）${'<div style="height:20px"></div>'}`};
const SEED_QUESTIONS=[
 {id:'q1',stem:'fraction',topic:'分数运算',grade:'六年级',subject:'数学',cause:'计算出错',status:'pending',source:'分数四则运算 · 单元练习',answer:'3/2（或 1.5）',explain:'先算括号：5/6 − 1/3 = 1/2，再算 3/4 ÷ 1/2 = 3/2。',ink:'= 9/10',history:[{date:'10月18日',result:'wrong'}]},
 {id:'q2',stem:'percent',topic:'百分数',grade:'六年级',subject:'数学',cause:'题意没看清',status:'pending',source:'百分数的应用 · 课堂练习',answer:'102 元',explain:'现价 = 原价 × 85%，120 × 85% = 102（元）。',history:[{date:'10月17日',result:'correct'}]},
 {id:'q3',stem:'ratio',topic:'比和比例',grade:'六年级',subject:'数学',cause:'方法不会',status:'pending',source:'比的应用 · 单元练习',answer:'男生 16 人，女生 24 人',explain:'总份数为 2 + 3 = 5，每份 40 ÷ 5 = 8 人，男生 8 × 2 = 16 人，女生 8 × 3 = 24 人。',history:[]},
 {id:'q4',stem:'circle',topic:'圆',grade:'六年级',subject:'数学',cause:'知识点不熟',status:'pending',source:'圆的面积 · 课堂练习',answer:'50.24 平方厘米',explain:'S = πr² = 3.14 × 4 × 4 = 50.24（平方厘米）。',history:[]},
 {id:'q5',stem:'equation',topic:'方程',grade:'五年级',subject:'数学',cause:'计算出错',status:'mastered',source:'小学旧题 · 简易方程',answer:'x = 14',explain:'3x = 60 − 18 = 42，所以 x = 42 ÷ 3 = 14。',history:[{date:'10月10日',result:'correct'},{date:'10月13日',result:'correct'},{date:'10月19日',result:'correct'}]},
 {id:'q6',stem:'area',topic:'应用题',grade:'四年级',subject:'数学',cause:'题意没看清',status:'mastered',source:'小学旧题 · 面积应用',answer:'288 千克',explain:'先求面积 12 × 8 = 96（平方米），再求收获 96 × 3 = 288（千克）。',history:[{date:'10月19日',result:'correct'}]}
];
const SCAN_QUESTIONS=[
 {id:'s1',stem:'scanFraction',topic:'分数运算',answer:'4/5',explain:'2/3 × 9/10 = 3/5；3/5 + 1/5 = 4/5。',ink:'= 1/2'},
 {id:'s2',stem:'scanPercent',topic:'百分数',answer:'100 本',explain:'80 ×（1 + 25%）= 100（本）。',ink:'80 × 25% = 20 本'},
 {id:'s3',stem:'scanRatio',topic:'比和比例',answer:'60 mL',explain:'300 ÷（1 + 4）× 1 = 60（mL）。',ink:'300 ÷ 4 = 75'},
 {id:'s4',stem:'scanCircle',topic:'圆',answer:'31.4 cm',explain:'C = πd = 3.14 × 10 = 31.4（cm）。',ink:'3.14 × 5 = 15.7'}
];
const TOPICS=['分数运算','百分数','比和比例','圆','方程','应用题'];
const CAUSES=['计算出错','题意没看清','方法不会','知识点不熟','其他'];
const STORAGE_KEY='shiti-interactive-demo-v1';
const freshData=()=>({questions:JSON.parse(JSON.stringify(SEED_QUESTIONS)),papers:[],counter:1});
let data=freshData(),storageOK=true;
try{const stored=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(stored&&Array.isArray(stored.questions)&&stored.questions.length&&stored.questions.every(q=>STEMS[q.stem])&&Array.isArray(stored.papers))data=stored;}catch(error){storageOK=false;}
let state={page:'library',tab:'library',filter:'pending',subject:'数学',search:'',topic:'全部',detailId:null,answer:false,scanSelected:new Set(),hiddenInk:false,mode:'auto',practiceTopics:new Set(),practiceCount:5,includeMastered:false,manualSelected:new Set(),paperId:null,space:'medium',paperAnswers:false,reviewIndex:0,reviewResults:{},reviewAnswer:false,savedScanIds:[],lastReview:null,modal:null};
const screen=document.getElementById('screen');
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch(error){storageOK=false;}}
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>{el.hidden=true;},2600);}
function navigate(page,options={}){Object.assign(state,options,{page,modal:null});if(['library','scan','practice'].includes(page))state.tab=page;render();screen.scrollTop=0;}
function questionHTML(q){return `<div class="q-content">${STEMS[q.stem]()}</div>`;}
function appHeader(title,note='',back=null,right=''){return `<div class="app-top"><div class="top-left">${back?`<button class="icon-button back" data-action="go" data-page="${back}" aria-label="返回">${icon('back')}</button>`:''}<div><h2>${title}</h2>${note?`<p class="title-note">${note}</p>`:''}</div></div>${right}</div>`;}
function notice(text,warm=false){return `<div class="notice ${warm?'warm':''}">${icon('info')}<span>${text}</span></div>`;}
function allTopics(){return [...new Set([...TOPICS,...data.questions.map(q=>q.topic)])];}
function topicChips(active,action,all=false){return `${all?`<button class="chip ${active==='全部'?'active':''}" data-action="${action}" data-value="全部">全部</button>`:''}${allTopics().map(t=>`<button class="chip ${(active instanceof Set?active.has(t):active===t)?'active':''}" data-action="${action}" data-value="${escapeHTML(t)}" aria-pressed="${active instanceof Set?active.has(t):active===t}">${escapeHTML(t)}</button>`).join('')}`;}
function libraryQuestions(){return data.questions.filter(q=>(state.subject==='全部'||q.subject===state.subject)&&(state.filter==='all'||q.status===state.filter)&&(state.topic==='全部'||q.topic===state.topic)&&(!state.search||`${q.topic} ${q.grade} ${q.source} ${q.cause} ${STEMS[q.stem]().replace(/<[^>]*>/g,'')}`.includes(state.search)));}
function cards(qs){if(!qs.length)return `<div class="empty">${icon('folder')}<p>这里还没有符合条件的题目</p><p class="subtle">试试其他知识点，或先拍一张试卷。</p><button class="btn soft" style="margin-top:14px" data-action="clear-filters">查看全部错题</button></div>`;return qs.map(q=>`<button class="card q-card" data-action="detail" data-id="${q.id}" aria-label="查看错题：${escapeHTML(q.topic)}，${escapeHTML(q.source)}"><div class="q-top"><div class="tag-row"><span class="tag">${escapeHTML(q.topic)}</span><span class="tag gray">${escapeHTML(q.grade)}</span></div><span class="tag ${q.status==='mastered'?'gray':'orange'}">${q.status==='mastered'?'已掌握':'待巩固'}</span></div>${questionHTML(q)}<div class="q-foot"><span>${escapeHTML(q.source)}</span>${icon('chevron')}</div></button>`).join('');}
function library(){const pending=data.questions.filter(q=>q.status!=='mastered').length;return `${appHeader('我的错题本','每一道错题，都是进步的起点',null,`<button class="avatar" data-action="settings" aria-label="打开设置">六</button>`)}${!storageOK?'<div class="storage-warning">当前浏览器不支持保存，刷新后可能恢复初始演示。</div>':''}<section class="hero"><div class="hero-top">${icon('leaf')} 今天，向前一小步</div><h3>${pending} 道题，等你再试试</h3><p>从不太熟的地方开始，慢慢变熟练。</p><button class="btn primary" data-action="go" data-page="practice">开始练一练 ${icon('arrow')}</button><div class="hero-flower"><svg viewBox="0 0 100 120" fill="none" aria-hidden="true"><path d="M46 113C45 83 54 55 58 19" stroke="currentColor" stroke-width="2"/><path d="M51 77C25 82 18 59 22 48c22-4 31 13 29 29Zm4-27c23 5 36-12 33-27-23-5-33 12-33 27Zm-6 46c26 6 40-9 41-23-26-8-39 8-41 23Z" fill="currentColor" opacity=".4"/><circle cx="59" cy="16" r="9" stroke="currentColor" stroke-width="1.5"/></svg></div></section><div class="search">${icon('search')}<input id="library-search" type="search" placeholder="搜索题目、知识点或来源" aria-label="搜索错题" value="${escapeHTML(state.search)}" autocomplete="off"></div><div class="subject-row">${['数学','语文','英语','全部'].map(s=>`<button class="chip ${state.subject===s?'active':''}" data-action="subject" data-value="${s}">${s}</button>`).join('')}</div><div class="chip-row">${[['pending','待巩固'],['mastered','已掌握'],['all','全部错题']].map(([id,name])=>`<button class="chip ${state.filter===id?'active':''}" data-action="filter" data-value="${id}">${name}</button>`).join('')}<button class="chip ${state.topic!=='全部'?'active':''}" data-action="filter-modal">${state.topic==='全部'?'知识点 ▾':escapeHTML(state.topic)+' ▾'}</button></div><div class="section-head"><h3>一点点，积累起来</h3><span class="subtle" id="question-count">共 ${libraryQuestions().length} 道</span></div><div id="question-list">${cards(libraryQuestions())}</div>`;}
function detail(){const q=data.questions.find(q=>q.id===state.detailId);if(!q)return appHeader('题目暂不可用','请返回错题本', 'library');return `${appHeader('错题详情',q.grade+' · '+q.subject,'library',`<button class="icon-button" data-action="edit-meta" aria-label="编辑题目分类">${icon('settings')}</button>`)}<div class="detail-image">${questionHTML(q)}${q.ink?`<div class="ink">原答：${escapeHTML(q.ink)}</div>`:''}</div><div class="card"><div class="info-row"><span class="subtle">知识点</span><span class="info-value"><span class="tag">${escapeHTML(q.topic)}</span> <button class="edit-link" data-action="edit-meta">修改</button></span></div><div class="info-row"><span class="subtle">这次错在哪里</span><span class="info-value">${escapeHTML(q.cause||'尚未记录')}</span></div><div class="info-row"><span class="subtle">掌握情况</span><button class="edit-link" data-action="toggle-mastered">${q.status==='mastered'?'已掌握 · 改为待巩固':'待巩固 · 标记已掌握'}</button></div><div class="info-row"><span class="subtle">来自</span><span class="info-value">${escapeHTML(q.source)}</span></div></div><button class="btn full" data-action="answer">${icon(state.answer?'book':'search')}${state.answer?'收起答案与解析':'想好了，再看答案'}</button>${state.answer?`<div class="answer"><strong>参考答案：${escapeHTML(q.answer)}</strong><p>${escapeHTML(q.explain)}</p><small class="subtle">演示用人工编写答案，非 AI 生成</small></div>`:''}<div class="section-head"><h3>我练过的足迹</h3><span class="subtle">${q.history.length} 次重做</span></div><div class="card">${q.history.length?q.history.slice(-4).reverse().map(h=>`<div class="history-item"><span>${escapeHTML(h.date)}</span><span>${h.result==='correct'?'✓ 这次做对了':'再练一练'}</span></div>`).join(''):'<p class="subtle" style="text-align:center;padding:6px">还没重做过，下一次试试看。</p>'}</div><button class="btn primary full" data-action="add-to-paper">${icon('plus')} 加入练习卷</button>`;}
function scan(){return `${appHeader('拍一张，收好它','从纸上的错题，开始新的练习')}<div class="scan-intro"><div class="scan-visual"><div class="mini-paper"><h4>六年级数学练习</h4><div class="line"></div><div class="line short"></div><div class="selection"><div class="line"></div><div class="line short"></div></div><div class="line"></div><div class="line short"></div></div><div class="scan-badge">${icon('scan')}</div></div><h3>不用抄，框一下就好</h3><p>拍下整张试卷，再选出想收集的题。<br>公式、图形，一起留下来。</p></div><button class="btn primary full" data-action="sample-scan">${icon('camera')} 模拟拍摄一张试卷</button><button class="btn full" data-action="sample-album" style="margin-top:11px">${icon('image')} 模拟从相册选择</button>${notice('这里使用内置示例试卷，不会开启相机，也不会读取你的相册。')}<div class="section-head"><h3>收题小提示</h3></div><div class="card"><p style="font-size:12px;color:#7a8575;line-height:2">① 试卷放平，题目拍清楚<br>② 框完整道题，别漏掉图和选项<br>③ 先收好，知识点可以稍后再补</p></div>`;}
function capture(){return `${appHeader('选出想收集的题','点击题目，或在纸上拖动框选','scan')}<div class="sheet-tools"><span class="subtle">示例试卷 · 第 1 页</span><button class="btn small" data-action="select-all-scan">${state.scanSelected.size===4?'取消全选':'选择全部'}</button></div><div class="worksheet ${state.hiddenInk?'hide-ink':''}" id="worksheet"><h3>六年级数学 · 巩固练习</h3><div class="sheet-meta">班级：六（1）班　姓名：小禾（示例）</div>${SCAN_QUESTIONS.map((q,i)=>`<button class="scan-question ${state.scanSelected.has(q.id)?'selected':''}" data-action="scan-pick" data-id="${q.id}" aria-pressed="${state.scanSelected.has(q.id)}" aria-label="选择第${i+1}题：${q.topic}">${state.scanSelected.has(q.id)?`<span class="selected-mark">${[...state.scanSelected].indexOf(q.id)+1}</span>`:''}<div class="q-content">${i+1}. ${STEMS[q.stem]()}</div><div class="ink">${q.ink}</div></button>`).join('')}</div><label class="toggle-row"><input type="checkbox" id="hide-ink" ${state.hiddenInk?'checked':''}>遮盖示例手写答案 <span class="draft-badge">效果模拟</span></label><p class="subtle" style="line-height:1.7">正式版支持手动遮盖和撤销；这里仅演示处理前后。</p><div class="sticky-action"><button class="btn primary" data-action="scan-next" ${!state.scanSelected.size?'disabled':''}>下一步 · 已选 ${state.scanSelected.size} 道题 ${icon('arrow')}</button></div>`;}
function classify(){const qs=SCAN_QUESTIONS.filter(q=>state.scanSelected.has(q.id));return `${appHeader('给错题安个家','分类可以慢慢补，先把题目留下','capture')}<div class="card">${qs.map((q,i)=>`<div class="mini-selected"><span class="mini-number">${i+1}</span><p>${STEMS[q.stem]().replace(/<div[^>]*><\/div>/g,'')}<span class="tag" style="margin-left:6px">${q.topic}</span></p></div>`).join('')}</div><div class="two-fields"><label class="field"><span>科目</span><select id="save-subject"><option>数学</option><option>语文</option><option>英语</option><option>科学</option></select></label><label class="field"><span>年级</span><select id="save-grade"><option>六年级</option><option>五年级</option><option>四年级</option><option>初一</option></select></label></div><label class="field"><span>知识点</span><select id="save-topic"><option value="per-question">沿用各题的示例知识点</option><option value="待分类">稍后再分类</option>${TOPICS.map(t=>`<option>${t}</option>`).join('')}</select></label><label class="field"><span>这次错在哪里 <small class="subtle">（选填）</small></span><select id="save-cause"><option value="">先不填写</option>${CAUSES.map(t=>`<option>${t}</option>`).join('')}</select></label>${notice('示例已预先填写知识点。正式版由你选择，AI 建议需要确认。')}<button class="btn primary full" data-action="save-scan">${icon('check')} 保存 ${qs.length} 道错题</button>`;}
function saved(){return `${appHeader('收好了','给未来的自己留一份练习')}<div class="success"><div class="success-icon">${icon('check')}</div><h3>${state.savedScanIds.length} 道错题，收进来了</h3><p>不用一次学会。<br>下一次，我们再试试看。</p><button class="btn primary full" data-action="saved-library">回到错题本 ${icon('arrow')}</button><button class="btn full" style="margin-top:10px" data-action="saved-practice">用这些题练一练</button><button class="btn ghost full" data-action="go" data-page="scan" style="margin-top:10px">继续拍下一张</button></div>`;}
function eligible(){return data.questions.filter(q=>(state.includeMastered||q.status!=='mastered')&&(!state.practiceTopics.size||state.practiceTopics.has(q.topic)));}
function chosenQuestions(){return state.mode==='manual'?data.questions.filter(q=>state.manualSelected.has(q.id)):eligible().slice(0,state.practiceCount);}
function practice(){const count=chosenQuestions().length;return `${appHeader('练一练','选几道题，给自己一点新的进步')}<div class="mode-switch"><button class="${state.mode==='auto'?'active':''}" data-action="practice-mode" data-value="auto">帮我选题</button><button class="${state.mode==='manual'?'active':''}" data-action="practice-mode" data-value="manual">我自己选</button></div>${state.mode==='auto'?`<div class="card"><h3 style="font-size:14px">今天想练什么？</h3><p class="subtle" style="margin-top:5px">不选知识点时，从全部待巩固题中选择</p><div class="chip-row">${topicChips(state.practiceTopics,'practice-topic')}</div><label class="field"><span>想练几道题</span><select id="practice-count">${[3,5,8].map(n=>`<option value="${n}" ${state.practiceCount===n?'selected':''}>${n} 道 · ${n===3?'轻松开始':n===5?'刚刚好':'多一点挑战'}</option>`).join('')}</select></label><label class="toggle-row"><input type="checkbox" id="include-mastered" ${state.includeMastered?'checked':''}>也练练已经掌握的题</label></div>${notice(eligible().length<state.practiceCount?`想选 ${state.practiceCount} 道，目前找到 ${eligible().length} 道符合条件的题。将按实际数量组卷，你也可以放宽条件。`:`已找到 ${eligible().length} 道符合条件的题，本次选 ${count} 道。`,eligible().length<state.practiceCount)}<p class="subtle" style="line-height:1.8">这是原题重练：从你的错题里重新组卷。<br>AI 相似新题暂不接入此演示。</p>`:`<div class="section-head" style="margin-top:0"><h3>从自己的题里选</h3><span class="subtle">已选 ${count} 道</span></div>${data.questions.map(q=>`<button class="pick-card ${state.manualSelected.has(q.id)?'active':''}" data-action="manual-pick" data-id="${q.id}" aria-pressed="${state.manualSelected.has(q.id)}"><span class="check">✓</span><div>${questionHTML(q)}<small>${escapeHTML(q.topic)} · ${escapeHTML(q.grade)} · ${q.status==='mastered'?'已掌握':'待巩固'}</small></div></button>`).join('')}` }<div class="sticky-action"><button class="btn primary" data-action="generate-paper" ${!count?'disabled':''}>${icon('practice')} 生成练习卷 · ${count} 道题</button></div>${data.papers.length?`<div class="section-head"><h3>我的练习卷</h3><span class="subtle">${data.papers.length} 份</span></div>${data.papers.slice().reverse().map(p=>`<button class="paper-record" data-action="open-paper" data-id="${p.id}"><span class="paper-icon">${icon('practice')}</span><span><p>${escapeHTML(p.title)}</p><small>${p.questions.length} 道题 · ${p.completed?'已记录重做结果':'等你练一练'}</small></span>${icon('chevron')}</button>`).join('')}`:''}`;}
function currentPaper(){return data.papers.find(p=>p.id===state.paperId);}
function paperPages(p){const max=state.space==='large'?2:state.space==='small'?4:3;const pages=[];for(let i=0;i<p.questions.length;i+=max)pages.push({questions:p.questions.slice(i,i+max),start:i});return pages;}
function preview(){const p=currentPaper();if(!p)return appHeader('还没有练习卷','先选择几道题吧','practice');const pages=paperPages(p);return `${appHeader('练习卷预览',`${p.questions.length} 道题 · A4 纵向 · 原题重练`,'practice',`<button class="icon-button" data-action="rename-paper" aria-label="修改练习卷标题">${icon('settings')}</button>`)}<div class="mode-switch"><button class="${!state.paperAnswers?'active':''}" data-action="paper-view" data-value="student">学生练习卷</button><button class="${state.paperAnswers?'active':''}" data-action="paper-view" data-value="answer">家长参考页</button></div><div class="page-controls"><label for="paper-space">答题留白</label><select id="paper-space">${[['small','少一些'],['medium','适中'],['large','多一些']].map(([v,t])=>`<option value="${v}" ${state.space===v?'selected':''}>${t}</option>`).join('')}</select><span class="subtle">共 ${pages.length} 页</span></div>${pages.map((page,pi)=>`<article class="a4 space-${state.space}" aria-label="练习卷第${pi+1}页"><h3>${escapeHTML(p.title)}${state.paperAnswers?' · 参考答案':''}</h3><div class="paper-subtitle">姓名：________　日期：________　${state.paperAnswers?'家长核对使用':'慢慢想，认真做'}</div>${page.questions.map((q,i)=>`<div class="paper-question">${questionHTML({...q,stem:q.stem}).replace('<div class="q-content">',`<div class="q-content">${page.start+i+1}. `)}${state.paperAnswers?`<p class="paper-answer">答案：${escapeHTML(q.answer)}<br>${escapeHTML(q.explain)}</p>`:'<div class="answer-space"></div>'}</div>`).join('')}<div class="paper-footer">拾题 · 原题重练　 ${pi+1} / ${pages.length}</div></article>`).join('')}<div class="paper-toolbar"><button class="btn" data-action="print-paper">${icon('print')} 打印 / 存为 PDF</button><button class="btn soft" data-action="reorder-paper">${icon('undo')} 调整题序</button></div><p class="paper-summary">打印当前选中的${state.paperAnswers?'家长参考页（含答案）':'学生练习卷（不含答案）'}。<br>选择“另存为 PDF”可在电脑保存。</p><button class="btn primary full" data-action="start-review" style="margin-top:7px">${p.completed?'查看本次练习结果':'做完了，记录一下'} ${icon('arrow')}</button>`;}
function review(){const p=currentPaper();if(!p)return '';const q=p.questions[state.reviewIndex],result=state.reviewResults[q.id];return `${appHeader('这次练得怎么样？',p.title,'preview')}<div class="section-head"><span class="subtle">第 ${state.reviewIndex+1} / ${p.questions.length} 道</span><span class="subtle">已记录 ${Object.keys(state.reviewResults).length} 道</span></div><div class="progress-track"><div style="width:${Object.keys(state.reviewResults).length/p.questions.length*100}%"></div></div><div class="detail-image"><span class="tag" style="margin-bottom:13px">${escapeHTML(q.topic)}</span>${questionHTML(q)}</div><button class="btn full" data-action="review-answer">${state.reviewAnswer?'收起参考答案':'核对参考答案'}</button>${state.reviewAnswer?`<div class="answer"><strong>${escapeHTML(q.answer)}</strong><p>${escapeHTML(q.explain)}</p></div>`:''}<div class="result-options"><button class="btn ${result==='correct'?'active':''}" data-action="review-result" data-value="correct">${icon('check')} 做对了</button><button class="btn wrong ${result==='wrong'?'active':''}" data-action="review-result" data-value="wrong">再练练</button></div><div style="text-align:center"><button class="text-button" data-action="review-result" data-value="skip">${result==='skip'?'已标记暂未做':'这道暂时没做'}</button></div><div class="bottom-actions"><button class="btn" data-action="review-prev" ${state.reviewIndex===0?'disabled':''}>上一题</button><button class="btn primary" data-action="review-next" ${!result?'disabled':''}>${state.reviewIndex===p.questions.length-1?'保存本次结果':'下一题'} ${icon('arrow')}</button></div><p class="review-position">做错也没关系，知道哪里不熟就是进步。</p>`;}
function reviewDone(){const p=currentPaper(),r=p?.results||state.lastReview||{},correct=Object.values(r).filter(v=>v==='correct').length,wrong=Object.values(r).filter(v=>v==='wrong').length,skip=Object.values(r).filter(v=>v==='skip').length;return `${appHeader('又向前一步','每一次认真，都值得被记住','practice')}<div class="success"><div class="success-icon">${icon('leaf')}</div><h3>今天的努力，收到了</h3><p>会做的更熟练，<br>还不熟的，我们下次再见。</p><div class="review-counters"><div><strong>${correct}</strong><small>做对了</small></div><div><strong style="color:#aa8056">${wrong}</strong><small>再练练</small></div><div><strong style="color:#8b9682">${skip}</strong><small>暂未做</small></div></div>${notice('本次结果已记入模拟练习记录。一次做对不会自动标为已掌握。')}<button class="btn primary full" data-action="go" data-page="library">回到错题本</button><button class="btn full" style="margin-top:10px" data-action="go" data-page="practice">看看我的练习卷</button></div>`;}
function settings(){return `${appHeader('家长设置','演示数据仅保存在当前浏览器','library')}<div class="card"><div class="q-top"><h3>小禾的学习空间</h3><span class="tag">本地演示</span></div><p class="subtle">六年级 · ${data.questions.length} 道错题 · ${data.papers.length} 份练习卷</p></div><div class="section-head"><h3>资料与备份</h3></div><div class="settings-list"><button data-action="export-demo"><span>导出模拟资料备份</span>${icon('download')}</button><button data-action="reset-confirm"><span>恢复初始演示数据</span>${icon('undo')}</button><button data-action="ai-info"><span>AI 相似题 <small class="subtle">　暂未接入</small></span>${icon('chevron')}</button></div><div class="section-head"><h3>正式版安装方式</h3></div><div class="card"><div class="build-flow"><div><span>1</span>代码推送到 GitHub</div><div><span>2</span>在 GitHub 编译并生成 IPA</div><div><span>3</span>下载 IPA，自行签名侧载</div></div><p class="subtle" style="line-height:1.8">按你的要求沿用 StudyBuddy 的构建方式。<br>这里是流程说明，尚未配置实际构建。</p></div>${notice('本演示不接入相机、OCR 或模型 API。恢复初始数据只影响本演示，不涉及你的其他项目。')}`;}
const NOTES={library:['错题本，不只是收藏夹','先看需要巩固的题，找到一小步就开始。',['按科目、知识点筛选','点开卡片，看题目和重做记录','答案默认收起，先留一点思考空间'],'试试：点开一道错题'],detail:['把一道题真正留下来','题干、知识点和练习足迹放在一起。',['可以修改知识点与错因','掌握情况由孩子或家长确认','点击“加入练习卷”继续组卷'],'试试：修改分类或查看答案'],scan:['从一张试卷开始','孩子不用一题一题抄，也不用先填一堆信息。',['拍摄与相册是两个熟悉的入口','本原型使用内置数学试卷','无需相机或文件访问权限'],'试试：模拟拍摄一张试卷'],capture:['先选题，再整理','框完整道题，题干、选项和图形一起留下。',['点击选择，可连续选多题','鼠标可拖动框选多个题目','示例遮盖演示处理前后效果'],'试试：选两道题，再点下一步'],classify:['先收好，慢慢分类','年级沿用默认，错因允许先不填。',['一次保存多道错题','知识点可分题沿用或统一选择','取消返回时不会重复加入题库'],'试试：给题目换一个知识点'],saved:['收集之后，顺手练习','完成时给孩子明确反馈，也给出自然的下一步。',['回错题本看刚保存的题','直接用这些题组一张练习卷','也可以继续拍下一张'],'试试：用这些题练一练'],practice:['练什么，让选择更轻松','可以按知识点帮选，也可以一道一道自己选。',['题数不足会告诉你实际数量','已掌握题默认不进入推荐','所有题目都来自自己的错题本'],'试试：选“百分数”看看结果'],preview:['先看纸上的样子','确认题目和答题空间，再打印给孩子。',['答题留白可以调整','学生卷与家长参考页分开','可调整题序，再记录重做结果'],'试试：把留白改成多一些'],review:['知道哪里不熟，就有收获','做完后逐题记录，不急着给孩子一个总分。',['支持做对、再练练和暂未做','没做的题不会记作做错','结果在完成确认后统一保存'],'试试：记录一题，再点下一题'],reviewDone:['练习，形成一个小循环','收集、重练、记录，让错题有下文。',['查看本次正确和待巩固的数量','回错题详情可看到新的记录','再次查看结果不会重复计数'],'试试：回错题本查看练习足迹'],settings:['功能留给孩子，设置留给家长','常用操作尽量简单，复杂配置收在这里。',['演示支持浏览器本地保存','恢复初始演示可以重新试走','正式版通过 GitHub 构建 IPA'],'试试：恢复初始演示']};
function render(){const views={library,detail,scan,capture,classify,saved,practice,preview,review,reviewDone,settings};screen.innerHTML=(views[state.page]||library)();const nav=document.getElementById('app-nav');nav.innerHTML=[['library','book','错题本'],['scan','scan','拍试卷'],['practice','practice','练一练']].map(([id,ic,name])=>`<button class="${state.tab===id?'active':''}" data-action="go" data-page="${id}" ${state.tab===id?'aria-current="page"':''}>${id==='scan'?`<span class="scan-nav">${icon(ic)}</span>`:icon(ic)}<span>${name}</span></button>`).join('');const stage=['scan','capture','classify','saved'].includes(state.page)?1:['practice','preview'].includes(state.page)?2:['review','reviewDone'].includes(state.page)?3:0;document.getElementById('journey').innerHTML=[['library','把错题收好'],['scan','从试卷里选题'],['practice','组一张练习卷'],['review','看看练习的足迹']].map(([page,label],i)=>`<button class="${i===stage?'active':''}" data-action="journey" data-page="${page}"><span class="step-number">0${i+1}</span>${label}</button>`).join('');const note=NOTES[state.page]||NOTES.library;document.getElementById('companion-note').innerHTML=`<h3>${note[0]}</h3><p>${note[1]}</p><ul>${note[2].map(t=>`<li>${t}</li>`).join('')}</ul><span class="note-pill">${note[3]}</span>`;renderModal();if(state.page==='capture')attachDrag();}
function modal(content){state.modal=content;renderModal();}
function renderModal(){const root=document.getElementById('modal-root');root.innerHTML=state.modal?`<div class="modal-backdrop" data-action="backdrop-close"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(state.modal.title)}"><div class="modal-head"><h3>${state.modal.title}</h3><button class="icon-button" data-action="close-modal" aria-label="关闭弹窗">${icon('close')}</button></div>${state.modal.html}</section></div>`:'';if(state.modal){const first=root.querySelector('button,input,select');first?.focus();}}
function closeModal(){state.modal=null;renderModal();}
function editMeta(){const q=data.questions.find(q=>q.id===state.detailId);modal({title:'编辑这道题',html:`<label class="field"><span>知识点</span><select id="edit-topic">${allTopics().map(t=>`<option ${q.topic===t?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select></label><label class="field"><span>也可以添加自己的知识点</span><input id="edit-custom-topic" maxlength="20" placeholder="例如：百分数应用题（选填）"></label><label class="field"><span>这次错在哪里</span><select id="edit-cause"><option value="">先不填写</option>${CAUSES.map(t=>`<option ${q.cause===t?'selected':''}>${t}</option>`).join('')}</select></label><button class="btn primary full" data-action="save-meta">保存修改</button>`});}
function generatePaper(){const qs=chosenQuestions();if(!qs.length)return toast('先选一道题，再生成练习卷');const index=data.counter++;const paper={id:'p'+Date.now()+'-'+index,title:'我的数学巩固练习 '+String(index).padStart(2,'0'),questions:JSON.parse(JSON.stringify(qs)),completed:false,results:{}};data.papers.push(paper);persist();state.tab='practice';navigate('preview',{paperId:paper.id,paperAnswers:false,space:'medium'});}
function finishReview(){const p=currentPaper();if(p.completed){navigate('reviewDone');return;}if(p.questions.some(q=>!state.reviewResults[q.id])){const missing=p.questions.findIndex(q=>!state.reviewResults[q.id]);state.reviewIndex=missing;state.reviewAnswer=false;render();toast('还有题目没有记录，未做可以选择“暂时没做”');return;}const now=new Date(),date=`${now.getMonth()+1}月${now.getDate()}日`;for(const q of p.questions){const result=state.reviewResults[q.id];if(result==='skip')continue;const original=data.questions.find(item=>item.id===q.id);if(original){original.history.push({date,result});if(result==='wrong')original.status='pending';}}p.results={...state.reviewResults};p.completed=true;state.lastReview=p.results;persist();navigate('reviewDone');}
function preparePrint(){const p=currentPaper();if(!p)return;const pages=paperPages(p);document.getElementById('print-root').innerHTML=pages.map((page,pi)=>`<article class="print-page space-${state.space}"><h2>${escapeHTML(p.title)}${state.paperAnswers?' · 参考答案':''}</h2><p class="print-meta">姓名：________　日期：________　${state.paperAnswers?'家长核对使用':'慢慢想，认真做'}</p>${page.questions.map((q,i)=>`<div class="print-question">${questionHTML(q).replace('<div class="q-content">',`<div class="q-content">${page.start+i+1}. `)}${state.paperAnswers?`<p class="print-answer">答案：${escapeHTML(q.answer)}<br>${escapeHTML(q.explain)}</p>`:'<div class="print-blank"></div>'}</div>`).join('')}<div class="print-page-number">拾题 · 原题重练　${pi+1} / ${pages.length}</div></article>`).join('');window.print();}
function attachDrag(){const sheet=document.getElementById('worksheet');let drag=null,box=null;sheet.addEventListener('pointerdown',event=>{if(event.pointerType!=='mouse'||event.button!==0)return;const rect=sheet.getBoundingClientRect();drag={x:event.clientX,y:event.clientY,left:rect.left,top:rect.top,moved:false};});sheet.addEventListener('pointermove',event=>{if(!drag||!(event.buttons&1))return;if(Math.abs(event.clientX-drag.x)+Math.abs(event.clientY-drag.y)<9)return;drag.moved=true;if(!box){box=document.createElement('div');box.className='selection-drag';sheet.appendChild(box);}box.style.left=Math.max(0,Math.min(event.clientX,drag.x)-drag.left)+'px';box.style.top=Math.max(0,Math.min(event.clientY,drag.y)-drag.top)+'px';box.style.width=Math.abs(event.clientX-drag.x)+'px';box.style.height=Math.abs(event.clientY-drag.y)+'px';});sheet.addEventListener('pointerup',event=>{if(!drag)return;if(drag.moved){const left=Math.min(drag.x,event.clientX),right=Math.max(drag.x,event.clientX),topY=Math.min(drag.y,event.clientY),bottom=Math.max(drag.y,event.clientY);sheet.querySelectorAll('.scan-question').forEach(el=>{const r=el.getBoundingClientRect();if(r.left<right&&r.right>left&&r.top<bottom&&r.bottom>topY)state.scanSelected.add(el.dataset.id);});state.suppressScanClick=true;render();setTimeout(()=>{state.suppressScanClick=false;},0);}box?.remove();box=null;drag=null;});sheet.addEventListener('pointerleave',()=>{box?.remove();box=null;drag=null;});}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action,value=target.dataset.value,id=target.dataset.id,page=target.dataset.page;if(action==='backdrop-close'){if(event.target===target)closeModal();return;}
switch(action){
case 'go':if(state.page==='review'&&page!==state.page){modal({title:'先离开这次记录？',html:`<p class="subtle" style="margin-bottom:18px">这次还没提交的结果不会保存，你可以稍后重新记录。</p><button class="btn primary full" data-action="leave-review" data-page="${page}">离开，稍后再记录</button><button class="btn full" style="margin-top:9px" data-action="close-modal">继续记录</button>`});}else navigate(page);break;
case 'leave-review':navigate(page);break;
case 'journey':if(page==='review'){if(data.papers.length){state.paperId=data.papers[data.papers.length-1].id;navigate(currentPaper().completed?'reviewDone':'preview',{tab:'practice'});}else{navigate('practice');toast('先组一张练习卷，再记录重做结果');}}else navigate(page);break;
case 'subject':state.subject=value;render();break;
case 'filter':state.filter=value;render();break;
case 'filter-modal':modal({title:'按知识点找题',html:`<div class="chip-row">${topicChips(state.topic,'library-topic',true)}</div><button class="btn full" style="margin-top:16px" data-action="close-modal">完成</button>`});break;
case 'library-topic':state.topic=value;state.modal=null;render();break;
case 'clear-filters':state.subject='全部';state.filter='all';state.search='';state.topic='全部';render();break;
case 'detail':navigate('detail',{detailId:id,answer:false});break;
case 'answer':state.answer=!state.answer;render();break;
case 'edit-meta':editMeta();break;
case 'save-meta':{const q=data.questions.find(q=>q.id===state.detailId);q.topic=document.getElementById('edit-custom-topic').value.trim()||document.getElementById('edit-topic').value;q.cause=document.getElementById('edit-cause').value;state.modal=null;persist();render();toast('分类已更新');break;}
case 'toggle-mastered':{const q=data.questions.find(q=>q.id===state.detailId);q.status=q.status==='mastered'?'pending':'mastered';persist();render();toast(q.status==='mastered'?'已标记掌握，继续保持':'已放回待巩固');break;}
case 'add-to-paper':state.manualSelected.add(state.detailId);state.mode='manual';navigate('practice');toast('已加入选题列表，可以继续选题');break;
case 'sample-scan':case 'sample-album':navigate('capture',{scanSelected:new Set(),hiddenInk:false,tab:'scan'});break;
case 'scan-pick':if(state.suppressScanClick)break;state.scanSelected.has(id)?state.scanSelected.delete(id):state.scanSelected.add(id);render();break;
case 'select-all-scan':state.scanSelected=state.scanSelected.size===4?new Set():new Set(SCAN_QUESTIONS.map(q=>q.id));render();break;
case 'scan-next':if(state.scanSelected.size)navigate('classify');break;
case 'save-scan':{if(!state.scanSelected.size)break;const subject=document.getElementById('save-subject').value,grade=document.getElementById('save-grade').value,topic=document.getElementById('save-topic').value,cause=document.getElementById('save-cause').value;const qs=SCAN_QUESTIONS.filter(q=>state.scanSelected.has(q.id)).map((q,i)=>({...q,id:'collected-'+Date.now()+'-'+i,topic:topic==='per-question'?q.topic:topic,subject,grade,cause,status:'pending',source:'新收集 · 六年级巩固练习',ink:state.hiddenInk?'':q.ink,history:[]}));data.questions.unshift(...qs);state.savedScanIds=qs.map(q=>q.id);state.scanSelected=new Set();persist();navigate('saved');break;}
case 'saved-library':navigate('library',{subject:'全部',topic:'全部',search:'',filter:'pending'});break;
case 'saved-practice':state.manualSelected=new Set(state.savedScanIds);state.mode='manual';navigate('practice');break;
case 'practice-mode':state.mode=value;render();break;
case 'practice-topic':state.practiceTopics.has(value)?state.practiceTopics.delete(value):state.practiceTopics.add(value);render();break;
case 'manual-pick':state.manualSelected.has(id)?state.manualSelected.delete(id):state.manualSelected.add(id);render();break;
case 'generate-paper':generatePaper();break;
case 'open-paper':navigate('preview',{paperId:id,paperAnswers:false,space:'medium'});break;
case 'paper-view':state.paperAnswers=value==='answer';render();break;
case 'rename-paper':modal({title:'给练习卷起个名字',html:`<label class="field"><span>练习卷标题</span><input id="paper-title" maxlength="24" value="${escapeHTML(currentPaper().title)}"></label><button class="btn primary full" data-action="save-paper-title">保存标题</button>`});break;
case 'save-paper-title':{const title=document.getElementById('paper-title').value.trim();if(!title){toast('标题还没有填写');break;}currentPaper().title=title;state.modal=null;persist();render();break;}
case 'reorder-paper':modal({title:'调整题目顺序',html:`<p class="subtle" style="margin-bottom:12px">点击箭头移动题目，练习卷会同步更新。</p>${currentPaper().questions.map((q,i)=>`<div class="mini-selected"><span class="mini-number">${i+1}</span><p style="flex:1">${escapeHTML(q.topic)}</p><button class="btn small" data-action="move-up" data-id="${q.id}" ${i===0?'disabled':''} aria-label="上移第${i+1}题">↑</button><button class="btn small" data-action="move-down" data-id="${q.id}" ${i===currentPaper().questions.length-1?'disabled':''} aria-label="下移第${i+1}题">↓</button></div>`).join('')}<button class="btn primary full" style="margin-top:18px" data-action="close-modal-render">完成</button>`});break;
case 'move-up':case 'move-down':{const qs=currentPaper().questions,i=qs.findIndex(q=>q.id===id),j=i+(action==='move-up'?-1:1);if(j<0||j>=qs.length)break;[qs[i],qs[j]]=[qs[j],qs[i]];persist();document.querySelector('[data-action="reorder-paper"]').click();break;}
case 'close-modal-render':state.modal=null;render();break;
case 'print-paper':preparePrint();break;
case 'start-review':if(currentPaper().completed)navigate('reviewDone');else navigate('review',{reviewIndex:0,reviewResults:{},reviewAnswer:false});break;
case 'review-answer':state.reviewAnswer=!state.reviewAnswer;render();break;
case 'review-result':state.reviewResults[currentPaper().questions[state.reviewIndex].id]=value;render();break;
case 'review-prev':if(state.reviewIndex>0){state.reviewIndex--;state.reviewAnswer=false;render();screen.scrollTop=0;}break;
case 'review-next':if(state.reviewIndex<currentPaper().questions.length-1){state.reviewIndex++;state.reviewAnswer=false;render();screen.scrollTop=0;}else finishReview();break;
case 'settings':navigate('settings');break;
case 'export-demo':{const blob=new Blob([JSON.stringify({format:'shiti-demo-backup',version:1,demoOnly:true,...data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='拾题-模拟资料备份.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出模拟数据，正式版将包含原图等资料');break;}
case 'ai-info':modal({title:'相似新题，先留一个位置',html:`<p class="subtle" style="line-height:1.9">正式版可选择接入免费模型，生成相似题草稿，由家长审核后再给孩子练习。<br><br>此原型仅演示已有错题重新组卷，不调用模型，也不产生 API 费用。</p><button class="btn primary full" style="margin-top:20px" data-action="close-modal">知道了</button>`});break;
case 'reset-confirm':modal({title:'重新体验一遍？',html:`<p class="subtle" style="margin-bottom:19px">会清除你在本演示中新加的错题、练习卷和记录，恢复到最初的 6 道示例题。不影响其他资料。</p><button class="btn primary full" data-action="reset-data">恢复初始演示</button><button class="btn full" style="margin-top:10px" data-action="close-modal">保留当前体验</button>`});break;
case 'reset-data':data=freshData();persist();state={...state,page:'library',tab:'library',subject:'数学',filter:'pending',search:'',topic:'全部',manualSelected:new Set(),scanSelected:new Set(),practiceTopics:new Set(),paperId:null,practiceCount:5,includeMastered:false,mode:'auto',modal:null,reviewResults:{},savedScanIds:[]};render();screen.scrollTop=0;toast('已经恢复，可以从拍试卷开始体验');break;
case 'close-modal':closeModal();break;
}
});
document.addEventListener('input',event=>{if(event.target.id==='library-search'){state.search=event.target.value;const qs=libraryQuestions();document.getElementById('question-list').innerHTML=cards(qs);document.getElementById('question-count').textContent='共 '+qs.length+' 道';}});
document.addEventListener('change',event=>{const el=event.target;if(el.id==='hide-ink'){state.hiddenInk=el.checked;document.getElementById('worksheet').classList.toggle('hide-ink',el.checked);}if(el.id==='practice-count'){state.practiceCount=Number(el.value);render();}if(el.id==='include-mastered'){state.includeMastered=el.checked;render();}if(el.id==='paper-space'){state.space=el.value;render();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal)closeModal();if(event.key==='Tab'&&state.modal){const focusable=[...document.querySelectorAll('.modal button:not(:disabled),.modal input,.modal select,.modal textarea')];const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
document.getElementById('brand-icon').innerHTML=icon('book');document.getElementById('status-icons').innerHTML=icon('signal')+icon('wifi')+icon('battery');
render();
</script>
</body>
